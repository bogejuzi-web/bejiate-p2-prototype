<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动审批</title><link rel="stylesheet" href="/activity-application.css"><body><div class="layout"><aside id="sidebar"></aside><main class="main"><header class="top"><div><h2>活动审批</h2><p>查看全量活动申请，并对审核中的申请执行单级审批。</p></div></header><section class="toolbar"><input id="search" placeholder="搜索活动主题或申请人"><select id="status-filter"><option value="">全部状态</option><option value="reviewing">审核中</option><option value="returned">退回补充</option><option value="approved">已通过</option><option value="rejected">已驳回</option><option value="withdrawn">已撤回</option><option value="draft">草稿</option></select><select id="time-filter"><option value="">全部时间</option><option value="2026-09-15">今天</option><option value="2026-09-14">近两天</option></select></section><section id="approval-list" class="list"></section></main></div><div class="drawer" id="detail-drawer"><section class="drawer-panel"><div class="top"><div><h2>活动申请详情</h2><p>确认申请内容后完成单级审批处理。</p></div><button class="secondary" id="detail-close">关闭</button></div><section id="detail-content" class="detail"></section></section></div><div class="modal" id="decision-modal"><section class="modal-panel"><h2 id="decision-title" style="margin-top:0"></h2><p id="decision-hint" style="color:#656b75"></p><label class="field"><span>处理意见</span><textarea id="decision-comment" placeholder="请输入处理意见" required></textarea></label><p class="error" id="decision-error"></p><footer class="form-actions"><button class="secondary" id="decision-cancel">取消</button><button class="primary" id="decision-confirm">确认处理</button></footer></section></div><script src="/nurse-portal-source.js"></script><script src="/admin-portal-shell.js"></script><script src="/activity-application-shared.js"></script><script>
;(function(){const api=window.ActivityApplication;const q=s=>document.querySelector(s);let pending={id:'',result:''};AdminPortalShell.mountSidebar('#sidebar','A12');function esc(v){return String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const keyword=q('#search').value.trim();const filter=q('#status-filter').value;const day=q('#time-filter').value;const rows=api.get('activityApplications').filter(x=>(!filter||x.status===filter)&&(!day||x.updatedAt.indexOf(day)>=0)&&(!keyword||(x.values['activity-theme']||'').includes(keyword)||x.nurseName.includes(keyword))).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));const box=q('#approval-list');box.replaceChildren();if(!rows.length){box.innerHTML='<div class="empty">暂无匹配的活动申请。</div>';return}rows.forEach(app=>{const st=api.status(app.status,'admin');const row=document.createElement('article');row.className='row';row.innerHTML='<div><h3>'+esc(app.values['activity-theme']||'未命名活动')+' <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>申请人：'+esc(app.nurseName)+' · '+esc(app.formName)+'</p><p>更新于 '+esc(app.updatedAt)+(app.approval?' · 最近处理：'+esc(app.approval.operatorName):'')+'</p></div>';const ops=document.createElement('div');ops.className='ops';const detail=document.createElement('button');detail.className='text-btn';detail.textContent='查看详情';detail.onclick=()=>openDetail(app.id);ops.append(detail);row.append(ops);box.append(row)})}
function openDetail(id){const app=api.appById(id);if(!app)return;const form=api.formById(app.formId)||{fields:[]};const st=api.status(app.status,'admin');const fields=form.fields.map(f=>'<dt>'+esc(f.label)+'</dt><dd>'+esc(app.values[f.id]||'—')+'</dd>').join('');const history=app.approval?'<section class="card"><h3 style="margin-top:0">最近审批处理</h3><p><i class="tag '+api.status(app.approval.result,'admin').tone+'">'+api.status(app.approval.result,'admin').label+'</i></p><p>'+esc(app.approval.comment)+'</p><p style="color:#656b75">'+esc(app.approval.operatorName)+' · '+esc(app.approval.processedAt)+'</p></section>':'';const actions=app.status==='reviewing'?'<div class="ops"><button class="primary" data-result="approved">通过</button><button class="secondary" data-result="returned">退回补充</button><button class="secondary danger-text" data-result="rejected">驳回</button></div>':'<p class="notice">该申请当前为“'+st.label+'”状态，不能继续审批。</p>';q('#detail-content').innerHTML='<div class="detail-head"><div><h3>'+esc(app.values['activity-theme']||'未命名活动')+'</h3><p><i class="tag '+st.tone+'">'+st.label+'</i> · 申请人：'+esc(app.nurseName)+'</p></div></div><dl>'+fields+'</dl>'+history+actions;q('#detail-content').querySelectorAll('[data-result]').forEach(button=>button.onclick=()=>openDecision(app.id,button.dataset.result));q('#detail-drawer').classList.add('open')}
function openDecision(id,result){pending={id,result};const label=result==='approved'?'通过':'退回补充';q('#decision-title').textContent=result==='rejected'?'驳回活动申请':label+'活动申请';q('#decision-hint').textContent=result==='approved'?'请填写通过意见；处理结果会同步给申请人。':result==='returned'?'请说明需要补充的内容；申请人可修改后再次提交。':'请填写驳回原因；驳回后申请不可重新提交。';q('#decision-comment').value=result==='approved'?'活动方案完整，同意开展。':'';q('#decision-error').textContent='';q('#decision-modal').classList.add('open')}
function confirmDecision(){const comment=q('#decision-comment').value.trim();if(!comment){q('#decision-error').textContent='请填写处理意见。';return}const app=api.appById(pending.id);if(!app||app.status!=='reviewing'){q('#decision-modal').classList.remove('open');render();return}const admin=api.get('admins').find(x=>x.id===api.currentAdmin())||{id:'admin-001',name:'管理员'};app.status=pending.result;app.updatedAt=api.now();app.approval={result:pending.result,comment:comment,operatorId:admin.id,operatorName:admin.name,processedAt:api.now()};api.saveApp(app);api.createNotice(app,pending.result);q('#decision-modal').classList.remove('open');q('#detail-drawer').classList.remove('open');render();parent.postMessage({type:'prototype:state-changed',pageId:'A12',scenarioId:pending.result},'*')}
q('#detail-close').onclick=()=>q('#detail-drawer').classList.remove('open');q('#decision-cancel').onclick=()=>q('#decision-modal').classList.remove('open');q('#decision-confirm').onclick=confirmDecision;q('#search').oninput=render;q('#status-filter').onchange=render;q('#time-filter').onchange=render;render();parent.postMessage({type:'prototype:page-ready',pageId:'A12'},'*')})()
</script></body></html>

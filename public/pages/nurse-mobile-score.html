<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/nurse-portal-source.js"></script><script src="/nurse-portal-mobile-shell.js"></script><style>body{margin:0;font-family:Arial,"PingFang SC"} .card{margin:10px;padding:14px;border:1px solid #ddd;border-radius:10px}.stage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.card h2{font-size:15px;margin:0 0 8px}.card p{font-size:13px;color:#41454d}.stage-toggle{flex:none;padding:5px 10px;border:1px solid #d9dde3;border-radius:6px;background:#fff;color:#41454d}.metric{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}.metric span{padding:9px;background:#f4f6f8;border-radius:6px}.card.collapsed .metric{display:none}</style></head><body><script>(()=>{const s=window.NURSE_PORTAL_SOURCE,n=s.getCurrentNurseId(),c=NursePortalMobileShell.mountShell({title:'评分详情',showBack:true,onBack:()=>NursePortalMobileShell.navigate('NM06')}),bound=s.get('bindings').filter(b=>b.nurseId===n&&b.status==='bound').map(b=>b.patientId);c.innerHTML=s.get('scoreStages').slice().sort((a,b)=>b.startDate.localeCompare(a.startDate)).map(x=>{const r=s.get('records').filter(v=>v.nurseId===n&&v.submittedAt.slice(0,10)>=x.startDate&&v.submittedAt.slice(0,10)<=x.endDate),covered=new Set(r.filter(v=>bound.includes(v.patientId)).map(v=>v.patientId)).size,coverage=bound.length?Math.round(covered/bound.length*100):0,vs=[['随访次数',r.length,x.goals.followupCount+' 次'],['随访覆盖率',coverage+'%',x.goals.coverage+'%'],['线下跟诊数',r.filter(v=>v.followupMethod==='offline').length,x.goals.offlineCount+' 次'],['电话随访数',r.filter(v=>v.followupMethod==='phone').length,x.goals.phoneCount+' 次'],['入组人数',bound.length,x.goals.enrolledCount+' 人']];return '<section class="card"><div class="stage-head"><div><h2>'+x.name+'</h2><p>'+x.startDate+' 至 '+x.endDate+'</p></div><button class="stage-toggle" type="button" aria-expanded="true">收起</button></div><div class="metric">'+vs.map(v=>'<span>'+v[0]+'<br><b>'+v[1]+'</b> / 目标 '+v[2]+'</span>').join('')+'</div></section>'}).join('');c.addEventListener('click',e=>{const b=e.target.closest('.stage-toggle');if(!b)return;const card=b.closest('.card'),collapsed=card.classList.toggle('collapsed');b.textContent=collapsed?'展开':'收起';b.setAttribute('aria-expanded',String(!collapsed))})})()</script></body></html>

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动计划</title><script src="/nurse-portal-source.js"></script><script src="/applicant-account.js"></script><script src="/nurse-portal-mobile-shell.js"></script><script src="/activity-application-shared.js"></script><script>(()=>{const api=window.ActivityApplication,esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const style=document.createElement('style');style.textContent='.card{padding:14px;margin-bottom:10px;border:1px solid #e2e8ec;border-radius:10px;background:#fff}.card h3{margin:0 0 8px;font-size:16px}.card p{margin:5px 0;color:#65717a;font-size:13px}.btn{width:100%;margin-top:10px;padding:10px;border:0;border-radius:8px;background:#155f8d;color:#fff;font:inherit}.btn:disabled{opacity:.45}.empty{padding:28px 16px;text-align:center;color:#65717a;background:#fff;border-radius:10px}.overlay{position:fixed;inset:0;z-index:20;padding:16px;display:flex;align-items:flex-end;background:rgba(15,23,42,.42)}.dialog{width:100%;max-height:86vh;overflow:auto;padding:18px;border-radius:14px;background:#fff}.dialog h2{margin:0}.dialog-top{display:flex;justify-content:space-between;align-items:center}.field{display:block;margin:12px 0}.field span{display:block;margin-bottom:6px}.field input,.field select,.field textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd6dc;border-radius:8px;font:inherit}.secondary{border:1px solid #b9c7d0;background:#fff;color:#155f8d}.error{color:#b42318;font-size:13px}';document.head.append(style);let content;function render(){content=NursePortalMobileShell.mountShell({title:'活动计划',activeTab:'NM13'});const id=api.currentApplicant(),plans=api.availablePlans(id);if(!plans.length)content.innerHTML='<div class="empty">暂无可申请的已发布活动计划。</div>';plans.forEach(p=>{const s=api.planStats(p,id),card=document.createElement('article');card.className='card';card.innerHTML='<h3>'+esc(p.name)+'</h3><p>'+esc(p.formName)+' · V'+p.formVersion+'</p><p>'+(p.quotaMode==='limited'?'已分配 '+s.allocated+' · 已占用 '+s.occupied+' · 剩余 '+s.remaining:'不限额度，可直接申请')+'</p>';const b=document.createElement('button');b.className='btn';b.textContent='发起申请';b.disabled=p.quotaMode==='limited'&&s.remaining<=0;b.onclick=()=>openForm(p);card.append(b);content.append(card)})}function openForm(plan){const overlay=document.createElement('div');overlay.className='overlay';const dialog=document.createElement('section');dialog.className='dialog';dialog.setAttribute('role','dialog');dialog.innerHTML='<div class="dialog-top"><h2>发起申请</h2><button class="secondary" id="close">关闭</button></div><p>'+esc(plan.name)+' · '+esc(plan.formName)+'</p><form id="form"><div id="fields"></div><p id="error" class="error"></p><button class="btn">提交申请</button><button type="button" class="btn secondary" id="draft">保存草稿</button></form>';overlay.append(dialog);document.body.append(overlay);dialog.querySelector('#close').onclick=()=>overlay.remove();const fields=dialog.querySelector('#fields');(plan.formSnapshot.fields||[]).forEach(f=>{const label=document.createElement('label');label.className='field';label.innerHTML='<span>'+esc(f.label)+(f.required?'（必填）':'')+'</span>';let input;if(f.type==='option'){input=document.createElement('select');input.innerHTML='<option value="">请选择</option>'+(f.options||[]).map(x=>'<option>'+esc(x)+'</option>').join('')}else{input=document.createElement(f.type==='text'?'textarea':'input');if(['number','percentage'].includes(f.type))input.type='number';if(f.type==='date')input.type='date';if(f.type==='image')input.type='file'}input.dataset.id=f.id;input.dataset.required=String(!!f.required);label.append(input);fields.append(label)});function save(status){const values={},missing=[];fields.querySelectorAll('[data-id]').forEach(i=>{const v=i.type==='file'?(i.files[0]?'已选择：'+i.files[0].name:''):i.value.trim();values[i.dataset.id]=v;if(i.dataset.required==='true'&&!v)missing.push(i.dataset.id)});if(status==='reviewing'&&missing.length)return dialog.querySelector('#error').textContent='请完整填写必填项后再提交。';if(status==='reviewing'){const check=api.canSubmit(plan,api.currentApplicant());if(!check.ok)return dialog.querySelector('#error').textContent=check.message}api.saveApp({id:'activity-'+Date.now(),nurseId:api.currentApplicant(),nurseName:window.ApplicantAccount.current().name||'申请人',activityPlanId:plan.id,activityPlanName:plan.name,formId:plan.formId,formName:plan.formName,formSnapshot:api.formSnapshot(plan.formSnapshot),status,values,createdAt:api.now(),updatedAt:api.now()});overlay.remove();render()}dialog.querySelector('#form').onsubmit=e=>{e.preventDefault();save('reviewing')};dialog.querySelector('#draft').onclick=()=>save('draft')}render();parent.postMessage({type:'prototype:page-ready',pageId:'NM13'},'*')})()</script></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> · 角色管理</title><script src="/nurse-portal-source.js"></script><script src="/admin-portal-shell.js"></script><link rel="stylesheet" href="/nurse-portal-layout.css"><style>.tools{display:flex;gap:10px;margin:24px 0}.tools input,.tools select{width:230px;height:42px;padding:0 12px;border:1px solid #ddd;border-radius:6px}.role-row{grid-template-columns:.7fr 1.3fr 1.2fr 1.1fr 1fr 1.4fr}.role-row .ops{display:flex;justify-content:flex-end;gap:12px}.drawer .panel{max-width:820px}.field-grid,.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.menu-grid{grid-template-columns:repeat(3,1fr);gap:8px}.menu-grid label{padding:10px;border:1px solid #eef0f2;border-radius:6px;font-size:13px}.notice{min-height:18px;color:#aa2d00;font-size:13px}</style></head><body><main class="app"><aside class="side"></aside><section class="main" data-change-id="A03-C01"><header class="top"><h1>角色管理</h1><button class="primary" id="add">新增角色</button></header><div class="tools"><input id="search" placeholder="请输入角色名称搜索"><select id="status"><option value="">全部状态</option><option value="active">启用</option><option value="disabled">停用</option></select></div><section class="table"><div class="row head role-row"><span>ID</span><span>角色名称</span><span>创建时间</span><span>启用状态</span><span>权限数</span><span>操作</span></div><div id="list"></div></section></section></main><div class="drawer" id="drawer"><form class="panel" id="form"><h2 id="form-title">新增角色</h2><div class="field-grid"><label class="field"><span>角色名称</span><input id="name" required></label><label class="field"><span>是否启用</span><select id="enabled"><option value="active">启用</option><option value="disabled">禁用</option></select></label></div><label class="field"><span>备注</span><textarea id="remark" rows="3"></textarea></label><h3>菜单权限</h3><div class="menu-grid" id="menus"></div><p class="notice" id="error"></p><div class="actions"><button id="cancel" type="button">取消</button><button class="primary" type="submit">确认</button></div></form></div><script>(()=>{const q=s=>document.querySelector(s),source=window.NURSE_PORTAL_SOURCE;AdminPortalShell.mountSidebar('.side','A03');let edit=null;const menus=['申请人账号','角色管理','员工管理','知情同意','患者数据','随访管理','患者随访进度','模板配置'];const roles=()=>source.get('rolePermissions');function render(){const key=q('#search').value.trim(),state=q('#status').value,box=q('#list');box.replaceChildren();roles().filter(r=>(!key||r.roleName.includes(key))&&(!state||(r.status||'active')===state)).forEach((r,i)=>{const active=(r.status||'active')==='active',row=document.createElement('div');row.className='row role-row';row.innerHTML='<span>'+(i+1)+'</span><span>'+r.roleName+'</span><span>'+(r.createdAt||'2026-09-10 09:00')+'</span><span><i class="tag '+(active?'success':'muted')+'">'+(active?'启用':'停用')+'</i></span><span>'+r.features.filter(f=>f.enabled).length+' 项</span>';const ops=document.createElement('span');ops.className='ops';[['编辑',()=>open(r)],[active?'停用':'启用',()=>{const all=roles(),x=all.find(v=>v.role===r.role);x.status=active?'disabled':'active';source.set('rolePermissions',all);render()}]].forEach(([t,fn])=>{const b=document.createElement('button');b.className='text-btn';b.textContent=t;b.onclick=fn;ops.append(b)});if(!(source.get('staffMembers')||[]).some(s=>s.role===r.roleName)){const d=document.createElement('button');d.className='text-btn danger';d.textContent='删除';d.onclick=()=>{if(confirm('确认删除该角色？')){source.set('rolePermissions',roles().filter(x=>x.role!==r.role));render()}};ops.append(d)}row.append(ops);box.append(row)});if(!box.children.length)box.innerHTML='<div class="empty">暂无符合条件的角色。</div>'}function open(r){edit=r||null;q('#form-title').textContent=r?'编辑角色':'新增角色';q('#name').value=r?r.roleName:'';q('#enabled').value=r?(r.status||'active'):'active';q('#remark').value=r?(r.remark||''):'';const box=q('#menus');box.replaceChildren();menus.forEach((m,i)=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.dataset.label=m;c.checked=r?r.features.some(f=>f.label===m&&f.enabled):false;l.append(c,document.createTextNode(m));box.append(l)});q('#error').textContent='';q('#drawer').classList.add('open')}q('#add').onclick=()=>open();q('#cancel').onclick=()=>q('#drawer').classList.remove('open');q('#form').onsubmit=e=>{e.preventDefault();const name=q('#name').value.trim(),all=roles();if(!name){q('#error').textContent='请输入角色名称。';return}if(!edit&&all.some(r=>r.roleName===name)){q('#error').textContent='角色名称已存在。';return}const features=Array.from(q('#menus').querySelectorAll('input')).map((c,i)=>({id:'menu-'+i,label:c.dataset.label,enabled:c.checked,locked:false}));if(edit)Object.assign(all.find(r=>r.role===edit.role),{roleName:name,status:q('#enabled').value,remark:q('#remark').value,features});else all.push({role:'role-'+Date.now(),roleName:name,status:q('#enabled').value,remark:q('#remark').value,createdAt:'2026-09-10 10:00',features});source.set('rolePermissions',all);q('#drawer').classList.remove('open');render()};q('#search').oninput=render;q('#status').onchange=render;render();parent.postMessage({type:'prototype:page-ready',pageId:'A03'},'*')})()</script></body></html>

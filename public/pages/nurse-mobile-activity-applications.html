<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动申请（手机端）</title><body>
<section id="editor" class="full" hidden></section><section id="detail" class="full" hidden></section><section id="dialog" class="dialog" hidden></section>
<script src="/nurse-portal-source.js"></script><script src="/applicant-account.js"></script><script src="/nurse-portal-mobile-shell.js"></script><script src="/activity-application-shared.js"></script><script>
;(function(){const api=window.ActivityApplication,q=s=>document.querySelector(s);let editingId='',withdrawId='';const css=`
.activity-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.activity-head h2{margin:0;font-size:20px}.btn{border:0;border-radius:8px;padding:9px 12px;background:#155f8d;color:#fff;font-size:14px}.btn.plain{background:#fff;color:#155f8d;border:1px solid #b9c7d0}.btn.danger{color:#b42318;background:#fff;border:1px solid #f0b5ae}.filters{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-bottom:12px}.filters input,.filters select,.field input,.field select,.field textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd6dc;border-radius:8px;background:#fff;font:inherit}.card{padding:14px;margin-bottom:10px;border:1px solid #e2e8ec;border-radius:10px;background:#fff}.card h3{margin:0 0 7px;font-size:16px}.card p{margin:5px 0;color:#65717a;font-size:13px;line-height:1.5}.tag{display:inline-block;padding:2px 7px;border-radius:99px;font-size:12px;font-style:normal}.info{background:#e7f0ff;color:#1754aa}.warning{background:#fff4db;color:#9c6500}.success{background:#e5f6eb;color:#19733a}.danger{background:#ffebe9;color:#b42318}.muted{background:#edf1f3;color:#52616b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.text{border:0;background:transparent;color:#155f8d;padding:3px 0;font-size:14px}.empty{padding:28px 16px;text-align:center;color:#65717a;background:#fff;border-radius:10px}.full{position:fixed;z-index:20;inset:0;overflow:auto;background:#f8fafc}.full[hidden],.dialog[hidden]{display:none}.full-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:12px;background:#fff;border-bottom:1px solid #e2e8ec}.full-head h2{margin:0;font-size:17px}.full-body{padding:14px;padding-bottom:92px}.field{display:block;margin-bottom:14px}.field>span{display:block;margin-bottom:6px;font-size:14px;color:#26333b}.field small{display:block;margin-top:5px;color:#65717a;font-size:12px}.field textarea{min-height:84px;resize:vertical}.choice{display:flex;gap:7px;align-items:center;margin:8px 0;color:#3e4b54}.bottom-actions{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 14px;background:#fff;border-top:1px solid #e2e8ec}.error{color:#b42318;font-size:13px}.details dt{margin-top:14px;color:#65717a;font-size:13px}.details dd{margin:4px 0;color:#26333b;white-space:pre-wrap}.dialog{position:fixed;z-index:30;inset:0;background:rgba(0,0,0,.35);padding:0 20px}.dialog-box{position:absolute;left:20px;right:20px;top:42%;padding:18px;background:#fff;border-radius:12px}.dialog-box h3{margin:0 0 8px}.dialog-box p{margin:0 0 16px;color:#65717a;line-height:1.5}`;const style=document.createElement('style');style.textContent=css;document.head.append(style);
const editor=q('#editor'),detail=q('#detail'),dialog=q('#dialog');const content=NursePortalMobileShell.mountShell({title:'活动申请',activeTab:'NM11'});document.body.append(editor,detail,dialog);content.innerHTML='<div class="activity-head"><div><h2>我的活动</h2><p style="margin:5px 0;color:#65717a;font-size:13px">提交后由后台单级审批</p></div><button class="btn plain" id="notices">通知 <span id="unread"></span></button></div><div class="filters"><input id="search" placeholder="搜索活动主题"><select id="filter"><option value="">全部状态</option><option value="draft">草稿</option><option value="reviewing">已提交</option><option value="returned">退回补充</option><option value="approved">已通过</option><option value="rejected">已驳回</option><option value="withdrawn">已撤回</option></select></div><div id="list"></div><button class="btn" id="new" style="width:100%;margin-top:2px">新建活动申请</button>';
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function applicant(){return window.ApplicantAccount.current().name||'申请人'}
function render(){const key=q('#search').value.trim(),status=q('#filter').value,rows=api.get('activityApplications').filter(x=>x.nurseId===api.currentApplicant()&&(!status||x.status===status)&&(!key||(x.values['activity-theme']||'').includes(key))).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));q('#unread').textContent=(api.get('activityNotifications').filter(x=>!x.read).length||'') ;const box=q('#list');box.replaceChildren();if(!rows.length){box.innerHTML='<div class="empty">暂无活动申请。发布活动表单后，可在此新建并提交。</div>';return}rows.forEach(app=>{const st=api.status(app.status,'applicant'),el=document.createElement('article');el.className='card';el.innerHTML='<h3>'+esc(app.values['activity-theme']||'未命名活动')+' <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>'+esc(app.formName)+' · '+esc(app.updatedAt)+'</p>'+(app.approval?'<p>处理意见：'+esc(app.approval.comment)+'</p>':'')+'<div class="actions"><button class="text">查看详情</button></div>';el.querySelector('.text').onclick=()=>openDetail(app.id);box.append(el)})}
function close(id){q(id).hidden=true}function openEditor(app){const form=app?api.formById(app.formId):api.activeForm();if(!form){alert('当前没有可用的活动申请表单，请联系管理员发布表单。');return}editingId=app?.id||'';const box=q('#editor');box.hidden=false;box.innerHTML='<header class="full-head"><button class="text" id="editor-back">取消</button><h2>'+((app?.status==='returned')?'补充活动申请':app?'编辑活动申请':'新建活动申请')+'</h2><span style="width:32px"></span></header><main class="full-body"><p style="color:#65717a;font-size:13px">'+(app?.status==='returned'&&app.approval?'退回意见：'+esc(app.approval.comment):'请按活动表单填写，提交后进入后台审批。')+'</p><div id="fields"></div><p class="error" id="error"></p></main><footer class="bottom-actions"><button class="btn plain" id="draft">保存草稿</button><button class="btn" id="submit">提交申请</button></footer>';const fields=q('#fields');form.fields.filter(f=>!f.hidden).forEach(f=>{const value=app?.values[f.id]||'',label=document.createElement('label');label.className='field';label.innerHTML='<span>'+esc(f.label)+(f.required?'（必填）':'')+'</span>'+(f.hint?'<small>'+esc(f.hint)+'</small>':'');if(f.type==='option'){const input=document.createElement('select');input.dataset.id=f.id;input.dataset.required=f.required;input.innerHTML='<option value="">请选择</option>'+(f.options||[]).map(x=>'<option>'+esc(x)+'</option>').join('');input.value=value;label.append(input)}else if(f.type==='multi-option'){const wrap=document.createElement('div');wrap.dataset.id=f.id;wrap.dataset.required=f.required;wrap.dataset.kind='multi';(f.options||[]).forEach(opt=>{const optLabel=document.createElement('label');optLabel.className='choice';optLabel.innerHTML='<input type="checkbox" value="'+esc(opt)+'">'+esc(opt);optLabel.querySelector('input').checked=value.split('、').includes(opt);wrap.append(optLabel)});label.append(wrap)}else if(f.type==='image'){const input=document.createElement('input');input.type='file';input.accept='image/*';input.dataset.id=f.id;input.dataset.required=f.required;input.dataset.kind='file';input.dataset.value=value;const note=document.createElement('small');note.textContent=value||'仅模拟选择，不会实际上传。';input.onchange=()=>note.textContent=input.files[0]?'已选择：'+input.files[0].name:'仅模拟选择，不会实际上传。';label.append(input,note)}else{const input=document.createElement(f.type==='text'?'textarea':'input');input.dataset.id=f.id;input.dataset.required=f.required;if(f.type==='number'||f.type==='percentage')input.type='number';if(f.type==='date')input.type='date';input.value=value;label.append(input)}fields.append(label)});q('#editor-back').onclick=()=>close('#editor');q('#draft').onclick=()=>save('draft');q('#submit').onclick=()=>save('reviewing')}
function save(status){const form=editingId?api.formById(api.appById(editingId).formId):api.activeForm(),values={};let missing=false;q('#fields').querySelectorAll('[data-id]').forEach(el=>{let value;if(el.dataset.kind==='multi')value=Array.from(el.querySelectorAll(':checked')).map(x=>x.value).join('、');else if(el.dataset.kind==='file')value=el.files?.[0]?'已选择：'+el.files[0].name:el.dataset.value||'';else value=el.value.trim();if(el.dataset.required==='true'&&!value)missing=true;values[el.dataset.id]=value});if(status==='reviewing'&&missing){q('#error').textContent='请完整填写必填项后再提交。';return}let app=editingId?api.appById(editingId):null;if(app){app.values=values;app.status=status;app.updatedAt=api.now()}else app={id:'activity-'+Date.now(),formId:form.id,formName:form.name,nurseId:api.currentApplicant(),nurseName:applicant(),status,values,createdAt:api.now(),updatedAt:api.now()};api.saveApp(app);close('#editor');api.setSelected(app.id);render();parent.postMessage({type:'prototype:state-changed',pageId:'NM11',scenarioId:status},'*')}
function openDetail(id){const app=api.appById(id);if(!app)return;api.setSelected(id);const form=api.formById(app.formId)||{fields:[]},st=api.status(app.status,'applicant'),fields=form.fields.map(f=>'<dt>'+esc(f.label)+'</dt><dd>'+esc(app.values[f.id]||'—')+'</dd>').join('');q('#detail').hidden=false;q('#detail').innerHTML='<header class="full-head"><button class="text" id="detail-back">返回</button><h2>申请详情</h2><span style="width:32px"></span></header><main class="full-body"><article class="card"><h3>'+esc(app.values['activity-theme']||'未命名活动')+'</h3><p><i class="tag '+st.tone+'">'+st.label+'</i> · '+esc(app.updatedAt)+'</p></article><dl class="details">'+fields+'</dl>'+(app.approval?'<article class="card"><h3>审批处理</h3><p>'+esc(app.approval.comment)+'</p><p>'+esc(app.approval.operatorName)+' · '+esc(app.approval.processedAt)+'</p></article>':'')+'<div class="actions" id="detail-actions"></div></main>';q('#detail-back').onclick=()=>close('#detail');const actions=q('#detail-actions');if(['draft','returned'].includes(app.status)){const b=document.createElement('button');b.className='btn';b.textContent=app.status==='returned'?'补充并重提':'编辑申请';b.onclick=()=>{close('#detail');openEditor(app)};actions.append(b)}if(['reviewing','returned'].includes(app.status)){const b=document.createElement('button');b.className='btn danger';b.textContent='撤回申请';b.onclick=()=>confirmWithdraw(app.id);actions.append(b)}}
function confirmWithdraw(id){withdrawId=id;q('#dialog').hidden=false;q('#dialog').innerHTML='<div class="dialog-box"><h3>撤回申请？</h3><p>撤回后不可再次编辑、提交或审批，但可在记录中追溯。</p><div class="actions"><button class="btn plain" id="cancel">取消</button><button class="btn danger" id="confirm">确认撤回</button></div></div>';q('#cancel').onclick=()=>close('#dialog');q('#confirm').onclick=()=>{const app=api.appById(withdrawId);app.status='withdrawn';app.updatedAt=api.now();api.saveApp(app);close('#dialog');close('#detail');render()}}
q('#new').onclick=()=>openEditor(null);q('#notices').onclick=()=>NursePortalMobileShell.navigate('NM12');q('#search').oninput=render;q('#filter').onchange=render;render();const requested=api.selected();if(requested){api.setSelected('');setTimeout(()=>openDetail(requested),0)}parent.postMessage({type:'prototype:page-ready',pageId:'NM11'},'*')})()
</script></body></html>

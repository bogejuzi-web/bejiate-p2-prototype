<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动申请</title>
<script src="/nurse-portal-source.js"></script><script src="/applicant-account.js"></script><script src="/nurse-portal-mobile-shell.js"></script><script src="/activity-application-shared.js"></script>
<script>
(()=>{
 const api=window.ActivityApplication,esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const style=document.createElement('style');style.textContent='.card{padding:14px;margin-bottom:10px;border:1px solid #e2e8ec;border-radius:10px;background:#fff}.card h3{margin:0 0 7px;font-size:16px}.card p{margin:5px 0;color:#65717a;font-size:13px}.field{display:block;margin:12px 0}.field span{display:block;margin-bottom:6px;font-size:14px}.field input,.field select,.field textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd6dc;border-radius:8px;font:inherit}.btn{width:100%;padding:11px;border:0;border-radius:8px;background:#155f8d;color:#fff;font:inherit}.btn.secondary{margin-top:8px;background:#fff;color:#155f8d;border:1px solid #b9c7d0}.btn.text{margin-top:0;padding:0;background:transparent;color:#155f8d;text-align:right}.error{color:#b42318;font-size:13px}.empty{padding:28px 16px;text-align:center;color:#65717a;background:#fff;border-radius:10px}.plan-card{border-color:#8db5cf;background:#f4f9fc}.status{display:inline-block;padding:2px 7px;border-radius:999px;background:#eef2f5;color:#55616b;font-size:12px}.status.info{background:#eaf2ff;color:#155f8d}.status.success{background:#eaf7ea;color:#16733a}.status.warning{background:#fff0e8;color:#a7592c}.status.danger{background:#fff0ed;color:#b42318}';document.head.append(style);
 function plan(){return api.planById(api.selectedPlan())}function appForm(app){return app.formSnapshot||api.formById(app.formId)||{fields:[]}}
 function showList(){const content=NursePortalMobileShell.mountShell({title:'活动申请',activeTab:'NM11'}),selected=plan(),id=api.currentApplicant();if(selected){const s=api.planStats(selected,id),card=document.createElement('article');card.className='card plan-card';card.innerHTML='<h3>'+esc(selected.name)+'</h3><p>'+esc(selected.formName)+' · V'+selected.formVersion+'</p><p>'+(selected.quotaMode==='limited'?'剩余 '+s.remaining+' 场':'不限额度，可直接申请')+'</p>';const start=document.createElement('button');start.className='btn';start.textContent='发起申请';start.disabled=selected.quotaMode==='limited'&&s.remaining<=0;start.onclick=()=>showForm(null);card.append(start);content.append(card)}const rows=api.get('activityApplications').filter(a=>a.nurseId===id).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));if(rows.length){const title=document.createElement('p');title.textContent='我的活动申请';content.append(title)}rows.forEach(app=>{const st=api.status(app.status,'applicant'),card=document.createElement('article');card.className='card';card.innerHTML='<h3>'+esc((app.values||{})['activity-theme']||'未命名活动')+' <i class="status '+st.tone+'">'+st.label+'</i></h3><p>'+esc(app.activityPlanName||app.formName||'活动申请')+' · '+esc(app.updatedAt)+'</p>';const detail=document.createElement('button');detail.className='btn text';detail.textContent='查看详情';detail.onclick=()=>showDetail(app);card.append(detail);content.append(card)});if(!rows.length&&!selected)content.innerHTML='<div class="empty">暂无活动申请。请从活动计划发起申请。</div>';parent.postMessage({type:'prototype:page-ready',pageId:'NM11'},'*')}
 function showForm(app){const current=app&&app.activityPlanId?api.planById(app.activityPlanId):plan();if(!current){showList();return}const content=NursePortalMobileShell.mountShell({title:app?'编辑活动申请':'新建活动申请',showBack:true,onBack:showList}),formData=appForm(app||{formSnapshot:current.formSnapshot}),stats=api.planStats(current,api.currentApplicant()),head=document.createElement('article');head.className='card plan-card';head.innerHTML='<h3>'+esc(current.name)+'</h3><p>'+esc(current.formName)+' · V'+current.formVersion+'</p><p>'+(current.quotaMode==='limited'?'已分配 '+stats.allocated+' · 已占用 '+stats.occupied+' · 剩余 '+stats.remaining:'不限额度，可直接提交')+'</p>';content.append(head);const form=document.createElement('form'),fields=document.createElement('div'),error=document.createElement('p');error.className='error';(formData.fields||[]).forEach(field=>{const label=document.createElement('label');label.className='field';const text=document.createElement('span');text.textContent=field.label+(field.required?'（必填）':'');let input;if(field.type==='option'){input=document.createElement('select');input.append(new Option('请选择',''));(field.options||[]).forEach(v=>input.append(new Option(v,v)))}else{input=document.createElement(field.type==='text'?'textarea':'input');if(field.type==='number'||field.type==='percentage')input.type='number';if(field.type==='date')input.type='date';if(field.type==='image')input.type='file'}input.dataset.id=field.id;input.dataset.required=String(!!field.required);if(app&&field.type!=='image')input.value=(app.values||{})[field.id]||'';label.append(text,input);fields.append(label)});function save(status){const values={},missing=[];fields.querySelectorAll('[data-id]').forEach(input=>{const value=input.type==='file'?(input.files[0]?'已选择：'+input.files[0].name:''):input.value.trim();values[input.dataset.id]=value;if(input.dataset.required==='true'&&!value)missing.push(input.dataset.id)});if(status==='reviewing'&&missing.length){error.textContent='请完整填写必填项后再提交。';return}if(status==='reviewing'){const check=api.canSubmit(current,api.currentApplicant());if(!check.ok){error.textContent=check.message;return}}const next=app||{id:'activity-'+Date.now(),nurseId:api.currentApplicant(),nurseName:window.ApplicantAccount.current().name||'申请人',createdAt:api.now(),activityPlanId:current.id,activityPlanName:current.name,formId:current.formId,formName:current.formName,formSnapshot:api.formSnapshot(current.formSnapshot)};next.values=values;next.status=status;next.updatedAt=api.now();api.saveApp(next);showList()}const submit=document.createElement('button');submit.className='btn';submit.textContent='提交申请';const draft=document.createElement('button');draft.type='button';draft.className='btn secondary';draft.textContent='保存草稿';form.append(fields,error,submit,draft);form.onsubmit=e=>{e.preventDefault();save('reviewing')};draft.onclick=()=>save('draft');content.append(form)}
 function showDetail(app){const content=NursePortalMobileShell.mountShell({title:'申请详情',showBack:true,onBack:showList}),form=appForm(app),st=api.status(app.status,'applicant'),card=document.createElement('article');card.className='card';card.innerHTML='<h3>'+esc((app.values||{})['activity-theme']||'未命名活动')+' <i class="status '+st.tone+'">'+st.label+'</i></h3><p>'+esc(app.activityPlanName||app.formName||'活动申请')+'</p>';(form.fields||[]).forEach(f=>{const p=document.createElement('p');p.textContent=f.label+'：'+((app.values||{})[f.id]||'—');card.append(p)});if(app.approval){const p=document.createElement('p');p.textContent='审批意见：'+app.approval.comment;card.append(p)}content.append(card);if(['draft','returned'].includes(app.status)){const edit=document.createElement('button');edit.className='btn';edit.textContent='编辑申请';edit.onclick=()=>showForm(app);content.append(edit)}if(['reviewing','returned'].includes(app.status)){const withdraw=document.createElement('button');withdraw.className='btn secondary';withdraw.textContent='撤回申请';withdraw.onclick=()=>{if(confirm('确认撤回？')){app.status='withdrawn';app.updatedAt=api.now();api.saveApp(app);showList()}};content.append(withdraw)}}
 showList();
})();
</script></html>

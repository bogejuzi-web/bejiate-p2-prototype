<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> · 随访计划</title>
<script src="/nurse-portal-source.js"></script><script src="/nurse-portal-mobile-shell.js"></script><style>
:root{font-family:"Haas","PingFang SC","Microsoft YaHei",sans-serif;color:#181d26}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar select{flex:1;height:42px;padding:0 10px;border:1px solid #dddddd;border-radius:8px;background:#fff}.primary{height:42px;padding:0 13px;border:0;border-radius:8px;background:#181d26;color:#fff}.primary:disabled{background:#c5c8cc}.template-entry{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:12px;padding:12px;border:1px solid #dddddd;border-radius:10px;background:#fff;color:#181d26;text-align:left}.template-entry strong{font-size:14px;font-weight:500}.template-entry span{color:#1b61c9;font-size:13px}.notice{margin:0 0 12px;color:#41454d;font-size:13px}.count{margin-bottom:12px;color:#41454d;font-size:13px}.card{margin-bottom:10px;padding:14px;border:1px solid #dddddd;border-radius:10px;background:#fff}.head{display:flex;justify-content:space-between;gap:10px}.card h2{margin:0;font-size:15px;font-weight:500}.card p{margin:6px 0 0;color:#41454d;font-size:12px;line-height:1.5}.tag{display:inline-block;white-space:nowrap;padding:3px 7px;border-radius:99px;background:#f1f3f5;color:#41454d;font-size:11px;font-style:normal}.tag.active{background:#e7f4f1;color:#006400}.tag.draft{background:#fff3cc;color:#765a00}.tag.cancelled{background:#fdece5;color:#aa2d00}.ops{display:flex;gap:14px;margin-top:10px}.link{padding:0;border:0;color:#1b61c9;background:transparent;font-size:13px}.link.danger{color:#aa2d00}.empty{padding:28px 14px;border:1px dashed #cbd5dc;border-radius:10px;color:#41454d;text-align:center;font-size:13px}.sheet{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:#fff}.sheet.open{display:flex}.sheet header{display:flex;align-items:center;min-height:48px;padding:0 12px;border-bottom:1px solid #dddddd}.sheet header button{border:0;background:transparent;color:#1b61c9;font-size:14px}.sheet h1{flex:1;margin:0;font-size:16px;font-weight:500;text-align:center}.sheet main{flex:1;overflow:auto;padding:16px}.field{display:block;margin:0 0 14px}.field span{display:block;margin-bottom:6px;color:#41454d;font-size:13px}.field input,.field select{width:100%;height:42px;padding:0 10px;border:1px solid #dddddd;border-radius:7px;background:#fff}.template-list{display:flex;flex-direction:column;gap:8px}.template{width:100%;padding:12px;border:1px solid #dddddd;border-radius:8px;background:#fff;text-align:left}.template.selected{border-color:#181d26;background:#f4f6f8}.template strong,.template span{display:block}.template strong{font-size:14px;font-weight:500}.template span{margin-top:4px;color:#41454d;font-size:12px}.helper{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px;font-size:13px}.error{min-height:18px;color:#aa2d00;font-size:13px}.sheet-actions{display:flex;gap:10px;margin-top:20px}.sheet-actions button{flex:1;height:44px;border-radius:8px}.secondary{border:1px solid #dddddd;background:#fff;color:#41454d}
</style></head><body><div class="sheet" id="sheet"><header><button id="close" type="button">取消</button><h1 id="sheet-title">新建随访计划</h1><span style="width:38px"></span></header><main><p class="notice">计划生效后按排期生成任务；模板版本将在本计划中锁定。</p><form id="plan-form"><label class="field"><span>计划名称</span><input id="name" maxlength="30" placeholder="请输入计划名称"></label><label class="field"><span>首次随访日期</span><input id="date" type="date"></label><label class="field"><span>执行时间</span><input id="time" type="time"></label><label class="field"><span>执行频率</span><select id="frequency"><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option></select></label><label class="field"><span>结束条件</span><select id="end-type"><option value="date">结束日期</option><option value="occurrences">执行次数</option></select></label><label class="field" id="end-date-field"><span>结束日期</span><input id="end-date" type="date"></label><label class="field" id="end-count-field" hidden><span>执行次数</span><input id="end-count" type="number" min="1" placeholder="请输入次数"></label><div class="helper"><span>选择随访模板</span><button class="link" id="manage-templates" type="button">维护模板</button></div><div class="template-list" id="templates"></div><p class="error" id="error"></p><div class="sheet-actions"><button class="secondary" id="save-draft" type="button">保存草稿</button><button class="primary" id="save-active" type="submit">保存并生效</button></div></form></main></div><script>(()=>{
const source=window.NURSE_PORTAL_SOURCE,nurseId=source.getCurrentNurseId();const sheet=document.querySelector('#sheet');const content=NursePortalMobileShell.mountShell({title:'随访计划',showBack:true,onBack:()=>NursePortalMobileShell.navigate('NM05')});document.body.append(sheet);let patientId=source.getSelectedPatientId()||'',editing=null,templateId='';
const select=document.createElement('select'),create=document.createElement('button'),templateEntry=document.createElement('button'),count=document.createElement('p'),list=document.createElement('section');select.innerHTML='<option value="">请选择患者</option>';create.type='button';create.className='primary';create.textContent='新建计划';create.disabled=true;templateEntry.type='button';templateEntry.className='template-entry';templateEntry.innerHTML='<strong>随访模板</strong><span>查看与维护 ›</span>';templateEntry.onclick=()=>parent.postMessage({type:'prototype:navigation-request',pageId:'NM08'},'*');count.className='count';list.id='plans';const toolbar=document.createElement('div');toolbar.className='toolbar';toolbar.append(select,create);content.append(toolbar,templateEntry,count,list);
const nursePatients={
  'nurse-001':[{id:'patient-001',name:'王女士',patientNo:'PT-001',phone:'151 0165 8625'},{id:'patient-002',name:'李先生',patientNo:'PT-002',phone:'139 2245 7610'},{id:'patient-008',name:'杨先生',patientNo:'PT-008',phone:'159 3387 2214'}],
  'nurse-002':[{id:'patient-006',name:'孙先生',patientNo:'PT-006',phone:'158 7742 3300'}]
}
function patients(){return nursePatients[nurseId]||nursePatients['nurse-001']}function patient(id){return patients().find(x=>x.id===id)||{name:'未知患者',phone:''}}function tag(s){return {active:['生效中','active'],draft:['草稿','draft'],ended:['已结束',''],cancelled:['已取消','cancelled']}[s]||[s,'']}
function render(){select.innerHTML='<option value="">请选择患者</option>'+patients().map(p=>'<option value="'+p.id+'">'+p.name+' · '+p.phone+'</option>').join('');select.value=patientId;create.disabled=!patientId;const plans=source.get('plans').filter(p=>p.nurseId===nurseId&&(!patientId||p.patientId===patientId));count.textContent=patientId?'当前患者共 '+plans.length+' 个计划':'请选择患者后查看和维护随访计划';list.replaceChildren();if(!patientId)return;if(!plans.length){list.innerHTML='<div class="empty">该患者暂无随访计划，点击“新建计划”开始创建。</div>';return}plans.forEach(p=>{const state=tag(p.status),card=document.createElement('article');card.className='card';card.innerHTML='<div class="head"><div><h2>'+p.name+'</h2><p>'+patient(p.patientId).name+' · '+patient(p.patientId).phone+'</p></div><i class="tag '+state[1]+'">'+state[0]+'</i></div><p>'+p.firstDate+' '+p.executionTime+' · '+({daily:'每天',weekly:'每周',monthly:'每月'}[p.frequency])+'</p><p>模板：'+p.templateVersionSnapshot.name+'</p>';if(['active','draft'].includes(p.status)){const ops=document.createElement('div');ops.className='ops';const edit=document.createElement('button');edit.className='link';edit.type='button';edit.textContent='编辑';edit.onclick=()=>open(p);const cancel=document.createElement('button');cancel.className='link danger';cancel.type='button';cancel.textContent='取消计划';cancel.onclick=()=>{if(!confirm('确认取消该计划？取消后不再生成新任务。'))return;const all=source.get('plans'),target=all.find(x=>x.id===p.id);target.status='cancelled';source.set('plans',all);render()};ops.append(edit,cancel);card.append(ops)}list.append(card)})}
select.onchange=()=>{patientId=select.value;source.setSelectedPatientId(patientId);render()};create.onclick=()=>open();function activeTemplates(){return source.get('templates').filter(t=>t.status==='active'&&(t.visibility==='public'||t.creatorId===nurseId))}function renderTemplates(){const box=document.querySelector('#templates'),rows=activeTemplates();box.replaceChildren();if(!rows.length){box.innerHTML='<div class="empty">暂无可用模板，请先维护模板。</div>';templateId='';return}if(!rows.some(t=>t.id===templateId))templateId=rows[0].id;rows.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='template'+(t.id===templateId?' selected':'');b.innerHTML='<strong>'+t.name+'</strong><span>'+t.fields.map(f=>f.label).join('、')+'</span>';b.onclick=()=>{templateId=t.id;renderTemplates();if(!document.querySelector('#name').value)document.querySelector('#name').value=t.name};box.append(b)})}
function open(plan){editing=plan||null;document.querySelector('#sheet-title').textContent=editing?'编辑随访计划':'新建随访计划';document.querySelector('#name').value=editing?editing.name:'';document.querySelector('#date').value=editing?editing.firstDate:'2026-09-10';document.querySelector('#time').value=editing?editing.executionTime:'09:00';document.querySelector('#frequency').value=editing?editing.frequency:'weekly';document.querySelector('#end-type').value=editing?editing.endCondition.type:'date';document.querySelector('#end-date').value=editing&&editing.endCondition.type==='date'?editing.endCondition.endDate:'';document.querySelector('#end-count').value=editing&&editing.endCondition.type==='occurrences'?editing.endCondition.count:'';templateId=editing?editing.templateId:'';toggleEnd();renderTemplates();document.querySelector('#save-draft').hidden=!!editing;document.querySelector('#save-active').textContent=editing?'保存修改':'保存并生效';document.querySelector('#error').textContent='';sheet.classList.add('open')}
function toggleEnd(){const date=document.querySelector('#end-type').value==='date';document.querySelector('#end-date-field').hidden=!date;document.querySelector('#end-count-field').hidden=date}document.querySelector('#end-type').onchange=toggleEnd;document.querySelector('#close').onclick=()=>sheet.classList.remove('open');document.querySelector('#manage-templates').onclick=()=>{source.setSelectedPatientId(patientId);parent.postMessage({type:'prototype:navigation-request',pageId:'NM08'},'*')};
function save(status){const name=document.querySelector('#name').value.trim(),firstDate=document.querySelector('#date').value,time=document.querySelector('#time').value,endType=document.querySelector('#end-type').value,endDate=document.querySelector('#end-date').value,countValue=Number(document.querySelector('#end-count').value),tmpl=source.get('templates').find(t=>t.id===templateId),error=document.querySelector('#error');if(!name||!firstDate||!time||!tmpl||(endType==='date'&&!endDate)||(endType==='occurrences'&&(!countValue||countValue<1))){error.textContent='请完整填写计划信息并选择模板。';return}if(endType==='date'&&endDate<firstDate){error.textContent='结束日期不能早于首次随访日期。';return}const plans=source.get('plans');let target;if(editing){target=plans.find(p=>p.id===editing.id);Object.assign(target,{name,firstDate,executionTime:time,frequency:document.querySelector('#frequency').value,endCondition:endType==='date'?{type:'date',endDate}:{type:'occurrences',count:countValue},templateId:tmpl.id,templateVersionSnapshot:{name:tmpl.name,fields:JSON.parse(JSON.stringify(tmpl.fields))}})}else{target={id:'plan-'+Date.now(),patientId,nurseId,name,firstDate,executionTime:time,frequency:document.querySelector('#frequency').value,endCondition:endType==='date'?{type:'date',endDate}:{type:'occurrences',count:countValue},templateId:tmpl.id,templateVersionSnapshot:{name:tmpl.name,fields:JSON.parse(JSON.stringify(tmpl.fields))},status,nextDate:firstDate};plans.push(target);if(status==='active'){const tasks=source.get('tasks');tasks.push({id:'task-'+Date.now(),planId:target.id,patientId,nurseId,scheduledDate:firstDate,status:firstDate==='2026-09-09'?'due-today':'pending'});source.set('tasks',tasks)}}if(!editing)target.status=status;source.set('plans',plans);sheet.classList.remove('open');render()}
document.querySelector('#save-draft').onclick=()=>save('draft');document.querySelector('#plan-form').onsubmit=e=>{e.preventDefault();save(editing?editing.status:'active')};render();parent.postMessage({type:'prototype:page-ready',pageId:'NM07'},'*')})()</script></body></html>

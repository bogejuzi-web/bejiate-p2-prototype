;(function(){const api=window.FollowupAlert,q=s=>document.querySelector(s),supported=f=>['number','percentage','single-choice','multi-choice'].includes(f.type),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let editing=null,deletingId='',batchTemplateId='';AdminPortalShell.mountSidebar('#sidebar','A13');const templates=()=>api.get('templates');const template=id=>templates().find(x=>x.id===id);const field=(templateId,fieldId)=>template(templateId)?.fields.find(x=>x.id===fieldId);function templateOptions(selected,placeholder){return '<option value="">'+(placeholder||'全部模板')+'</option>'+templates().map(t=>'<option value="'+esc(t.id)+'" '+(t.id===selected?'selected':'')+'>'+esc(t.name)+'</option>').join('')}function renderList(){const keyword=q('#keyword').value.trim(),templateId=q('#template-filter').value,level=q('#level-filter').value,status=q('#status-filter').value;const rows=api.get('alertRules').filter(r=>{const t=template(r.templateId);return (!keyword||(r.name+' '+(t?.name||'')+' '+r.fieldLabel).includes(keyword))&&(!templateId||r.templateId===templateId)&&(!level||r.level===level)&&(!status||r.status===status)}).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));q('#count').textContent='共 '+rows.length+' 条规则';const box=q('#rules');box.replaceChildren();if(!rows.length){box.innerHTML='<div class="empty">暂无符合条件的预警规则。<br><button class="primary" id="empty-create" style="margin-top:14px">新增规则</button></div>';q('#empty-create').onclick=()=>openEditor();return}rows.forEach(r=>{const t=template(r.templateId),lv=api.levelMeta(r.level),row=document.createElement('article');row.className='rule-row';row.innerHTML='<div><h3>'+esc(r.name)+'</h3><p>更新时间：'+esc(r.updatedAt)+'</p></div><div><strong>'+esc(t?.name||'已删除模板')+'</strong><small>'+esc(r.fieldLabel)+'</small></div><div><strong>'+esc(api.describeCondition(r))+'</strong><small>'+esc(r.fieldType)+'</small></div><div><i class="tag '+lv.tone+'">'+lv.label+'级</i></div><div><i class="tag '+(r.status==='active'?'success':'muted')+'">'+(r.status==='active'?'已启用':'已停用')+'</i></div>';const actions=document.createElement('div');actions.className='rule-actions';const toggle=document.createElement('button');toggle.className='compact';toggle.textContent=r.status==='active'?'停用':'启用';toggle.onclick=()=>{const out=api.toggleRule(r.id);if(out.error)alert(out.error);renderList()};const edit=document.createElement('button');edit.className='compact';edit.textContent='编辑';edit.onclick=()=>openEditor(r);const del=document.createElement('button');del.className='compact danger-action';del.textContent='删除';del.onclick=()=>{deletingId=r.id;q('#delete-modal').classList.add('open')};actions.append(toggle,edit,del);row.append(actions);box.append(row)})}function conditionHTML(f,r){if(!f)return '';if(['number','percentage'].includes(f.type))return '<select id="condition-op"><option value="gt">大于</option><option value="lt">小于</option><option value="equals">等于</option><option value="inside">区间内</option><option value="outside">区间外</option></select><span id="condition-values"></span>';if(f.type==='single-choice')return '<select id="condition-expected"><option value="">请选择指定选项</option>'+(f.options||[]).map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select>';return '<select id="condition-op"><option value="includes-any">命中任一项</option><option value="includes-all">同时命中组合项</option></select><div class="rule-options" id="condition-triggers">'+(f.options||[]).map(x=>'<label><input type="checkbox" value="'+esc(x)+'"> '+esc(x)+'</label>').join('')+'</div>'}function paintNumeric(r){const op=q('#condition-op').value,box=q('#condition-values');box.innerHTML=['inside','outside'].includes(op)?'<span style="display:flex;gap:8px"><input id="condition-lower" type="number" placeholder="下限" value="'+(r?.lowerBound??'')+'"><input id="condition-upper" type="number" placeholder="上限" value="'+(r?.upperBound??'')+'"></span>':'<input id="condition-threshol =t.id);t.fields.forEach(f=>{const r=rules.find(x=>x.fieldId===f.id),row=document.createElement('article');if(!supported(f)){row.className='field-row unsupported';row.innerHTML='<div><h3>'+esc(f.label)+'</h3><small>'+esc(f.type)+'</small></div><div>当前字段类型不支持预警配置</div>';box.append(row);return}row.className='field-row'+(r?.status==='active'?'':' disabled');row.dataset.fieldId=f.id;row.dataset.ruleId=r?.id||'';row.innerHTML='<div><h3>'+esc(f.label)+'</h3><small>'+esc(f.type)+'</small></div><label><input data-enabled type="checkbox" '+(r?.status==='active'?'checked':'')+'> 启用</label><div class="config">'+batchConfig(f,r)+'</div><div class="config"><select data-level><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></div>';const numeric=['number','percentage'].includes(f.type);if(numeric){row.querySelector('[data-op]').value=r?.operator||'gt';paintBatch(row,r);row.querySelector('[data-op]').onchange=()=>paintBatch(row,{})}else if(f.type==='single-choice')row.querySelector('[data-expected]').value=r?.expectedValue||'';else{row.querySelector('[data-op]').value=r?.operator||'includes-any';row.querySelectorAll('[data-triggers] input').forEach(x=>x.checked=(r?.triggerValues||[]).includes(x.value))}row.querySelector('[data-level]').value=r?.level||'low';row.querySelector('[data-enabled]').onchange=()=>row.classList.toggle('disabled',!row.querySelector('[data-enabled]').checked);box.append(row)});q('#batch-summary').textContent='保存将以当前模板的全部行配置为准，仅影响后续随访提交。'}function saveBatch(){const configs=[...q('#batch-fields').querySelectorAll('[data-field-id]')].map(row=>({id:row.dataset.ruleId,fieldId:row.dataset.fieldId,enabled:row.querySelector('[data-enabled]').checked,operator:row.querySelector('[data-op]')?.value||'equals',threshold:row.querySelector('[data-threshold')?.value??'',lowerBound:row.querySelector('[data-lower')?.value??'',upperBound:row.querySelector('[data-upper')?.value??'',expectedValue:row.querySelector('[data-expected')?.value||'',triggerValues:[...row.querySelectorAll('[data-triggers] input:checked')].map(x=>x.value),level:row.querySelector('[data-level]').value}));const out=api.saveTemplateRules(batchTemplateId,configs);if(out.error){alert(out.error);return}showList();parent.postMessage({type:'prototype:state-changed',pageId:'A13',scenarioId:'A13-S03'},'*')}function showList(){q('#list-view').hidden=false;q('#batch-view').hidden=true;q('#subtitle').textContent='统一查看和维护随访预警规则。';renderList()}function showBatch(){q('#list-view').hidden=true;q('#batch-view').hidden=false;q('#subtitle').textContent='选择一个模板，一次配置其中全部可预警字段。';renderBatchTemplates();renderBatch()}q('#template-filter').innerHTML=templateOptions('','全部模板');['#keyword','#template-filter','#level-filter','#status-filter'].forEach(s=>q(s).oninput=renderList);q('#reset').onclick=()=>{q('#keyword').value='';q('#template-filter').value='';q('#level-filter').value='';q('#status-filter').value='';renderList()};q('#create').onclick=()=>openEditor();q('#batch-open').onclick=showBatch;q('#batch-back').onclick=showList;q('#batch-template').onchange=()=>{batchTemplateId=q('#batch-template').value;renderBatch()};q('#batch-save').onclick=saveBatch;q('#editor-cancel').onclick=()=>q('#editor-modal').classList.remove('open');q('#editor-form').onsubmit=e=>{e.preventDefault();const out=api.saveRule(readRule());if(out.error){q('#editor-error').textContent=out.error;return}q('#editor-modal').classList.remove('open');renderList();parent.postMessage({type:'prototype:state-changed',pageId:'A13',scenarioId:'A13-S02'},'*')};q('#delete-cancel').onclick=()=>q('#delete-modal').classList.remove('open');q('#delete-confirm').onclick=()=>{const out=api.deleteRule(deletingId);if(out.error)alert(out.error);q('#delete-modal').classList.remove('open');renderList();parent.postMessage({type:'prototype:state-changed',pageId:'A13',scenarioId:'A13-S04'},'*')};renderList();parent.postMessage({type:'prototype:page-ready',pageId:'A13'},'*')})()

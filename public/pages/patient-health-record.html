<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> · 健康档案</title>
  <style>
    :root { color: #181d26; background: #fff; font-family: "Haas", "PingFang SC", "Microsoft YaHei", sans-serif; } * { box-sizing: border-box; } body { margin: 0; background: #f3f3f3; } button, input { font: inherit; }.page { min-height: 100vh; padding: 0 0 80px; background: #f3f3f3; }.bar { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; height: 62px; padding: 0 12px; border-bottom: 1px solid #dddddd; background: #fff; }.bar button { border: 0; color: #181d26; background: transparent; font-size: 14px; }.bar h1 { margin: 0; font-size: 20px; font-weight: 500; text-align: center; }.bar .save { color: #006400; font-size: 16px; }.form { background: #fff; }.group { margin-top: 10px; background: #fff; }.row { display: grid; grid-template-columns: 104px 1fr; min-height: 72px; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid #eeeeee; }.row label { font-size: 17px; }.row input, .value { width: 100%; border: 0; outline: 0; color: #181d26; background: transparent; text-align: right; font-size: 16px; }.row input::placeholder { color: #b6bac0; }.value.muted { color: #b6bac0; }.value.select::after { content: '›'; margin-left: 10px; color: #c5c8cc; font-size: 24px; vertical-align: -2px; }.options { padding: 18px; border-bottom: 1px solid #eeeeee; }.options h2 { margin: 0 0 14px; font-size: 17px; font-weight: 400; }.options button { margin-right: 10px; padding: 9px 16px; border: 0; border-radius: 999px; color: #41454d; background: #f1f1f1; font-size: 15px; }.options button.selected { color: #fff; background: #181d26; }.history { width: 100%; margin-top: 10px; padding: 17px 18px; border: 0; color: #1b61c9; background: #fff; text-align: left; font-size: 15px; }.toast { position: fixed; right: 24px; bottom: 94px; left: 24px; display: none; padding: 12px 16px; border-radius: 10px; color: #fff; background: #181d26; font-size: 13px; text-align: center; }.toast.visible { display: block; }.tabbar { position: fixed; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: repeat(3, 1fr); min-height: 68px; padding: 7px 18px calc(7px + env(safe-area-inset-bottom)); border-top: 1px solid #dddddd; background: #fff; }.tab { border: 0; color: #41454d; background: transparent; font-size: 12px; }.tab[aria-current="page"] { color: #181d26; font-weight: 500; }.highlight { outline: 3px solid #f4d35e; outline-offset: -3px; }
  </style>
</head>
<body>
  <main class="page"><header class="bar"><button type="button" data-target="P04">‹ 返回</button><h1>健康档案</h1><button class="save" id="save" type="button" data-change-id="P05-C02">保存</button></header><section class="form" data-change-id="P05-C01"><div class="row"><label>手机号</label><span class="value">151 0165 8625</span></div><div class="row"><label for="id-card">身份证号</label><input id="id-card" placeholder="请输入身份证号"></div><div class="row"><label>身高</label><span class="value muted select">请选择</span></div><div class="row"><label for="weight">体重</label><input id="weight" inputmode="decimal" placeholder="请输入 kg"></div><div class="row"><label>BMI</label><span class="value muted">系统自动计算</span></div><div class="row"><label>腰围</label><span class="value muted select">请选择</span></div></section><section class="group"><div class="row"><label>吸烟史</label><span class="value muted select">请选择</span></div><div class="row"><label>饮酒史</label><span class="value muted select">请选择</span></div></section><section class="group"><div class="options"><h2>肝功能</h2><button type="button" class="selected">正常</button><button type="button">异常</button></div><div class="options"><h2>肾功能</h2><button type="button" class="selected">正常</button><button type="button">异常</button></div><div class="options"><h2>婚姻状况</h2><button type="button" class="selected">已婚</button><button type="button">未婚</button><button type="button">其他</button></div></section><div class="toast" id="toast">健康档案已保存</div></main><nav class="tabbar" aria-label="患者端导航"><button class="tab" type="button" data-target="P04">服务</button><button class="tab" type="button" aria-current="page">健康档案</button><button class="tab" type="button" data-target="P06">我的</button></nav>
  <script>
    (() => { const toast = document.querySelector('#toast'); document.querySelectorAll('[data-target]').forEach((button) => button.addEventListener('click', () => parent.postMessage({ type: 'prototype:navigation-request', pageId: button.dataset.target }, '*'))); document.querySelector('#save').addEventListener('click', () => { toast.classList.add('visible'); setTimeout(() => toast.classList.remove('visible'), 1600); }); document.querySelectorAll('.options button').forEach((button) => button.addEventListener('click', () => { button.parentElement.querySelectorAll('button').forEach((item) => item.classList.remove('selected')); button.classList.add('selected'); })); function highlight(changeId) { const target = document.querySelector(`[data-change-id="${changeId}"]`); if (!target) return; target.classList.add('highlight'); target.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => target.classList.remove('highlight'), 1800); parent.postMessage({ type: 'prototype:highlight-result', changeId, success: true }, '*'); } window.addEventListener('message', (event) => { if ((event.data || {}).type === 'prototype:highlight') highlight(event.data.changeId); }); parent.postMessage({ type: 'prototype:page-ready', pageId: 'P05' }, '*'); })();
  </script>
</body>
</html>

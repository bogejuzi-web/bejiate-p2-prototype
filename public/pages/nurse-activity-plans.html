<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动计划</title><link rel="stylesheet" href="/activity-application.css"><style>.overlay{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,42,.42)}.overlay.open{display:flex}.dialog{width:min(640px,100%);max-height:85vh;overflow:auto;padding:24px;border-radius:12px;background:#fff}.dialog .top{margin-bottom:10px}</style><body><div class="layout"><aside id="sidebar"></aside><main class="main"><header class="top"><div><h2>活动计划</h2><p>从已发布计划直接发起活动申请。</p></div></header><section id="list" class="list"></section></main></div><div id="overlay" class="overlay"><section class="dialog"><div class="top"><h2>发起申请</h2><button id="close" class="secondary">关闭</button></div><p id="plan-info" class="notice"></p><form id="form"><div id="fields" class="form-grid"></div><p id="error" class="error"></p><footer class="form-actions"><button id="draft" type="button" class="secondary">保存草稿</button><button class="primary">提交申请</button></footer></form></section></div><script src="/nurse-portal-source.js"></script><script src="/applicant-account.js"></script><script src="/nurse-portal-shell.js"></script><script src="/activity-application-shared.js"></script><script>(()=>{const q=s=>document.querySelector(s),api=window.ActivityApplication;let active;NursePortalShell.mountSidebar('#sidebar','N12');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const id=api.currentApplicant(),box=q('#list');box.replaceChildren();api.availablePlans(id).forEach(p=>{const s=api.planStats(p,id),row=document.createElement('article');row.className='row';row.innerHTML='<div><h3>'+esc(p.name)+'</h3><p>申请表单：'+esc(p.formName)+' · V'+p.formVersion+'</p><p>'+(p.quotaMode==='limited'?'已分配 '+s.allocated+' 场 · 已占用 '+s.occupied+' 场 · 剩余 '+s.remaining+' 场':'不限额度，可直接申请')+'</p></div>';const b=document.createElement('button');b.className='primary';b.textContent='发起申请';b.disabled=p.quotaMode==='limited'&&s.remaining<=0;b.onclick=()=>open(p);row.append(b);box.append(row)});if(!box.children.length)box.innerHTML='<div class="empty">暂无可申请的已发布活动计划。</div>'}function open(plan){active=plan;q('#plan-info').textContent=plan.name+' · '+plan.formName;const box=q('#fields');box.replaceChildren();plan.formSnapshot.fields.forEach(f=>{const l=document.createElement('label');l.className='field full';l.innerHTML='<span>'+esc(f.label)+(f.required?'（必填）':'')+'</span>';let i;if(f.type==='option'){i=document.createElement('select');i.innerHTML='<option value="">请选择</option>'+(f.options||[]).map(x=>'<option>'+esc(x)+'</option>').join('')}else{i=document.createElement(f.type==='text'?'textarea':'input');if(['number','percentage'].includes(f.type))i.type='number';if(f.type==='date')i.type='date';if(f.type==='image')i.type='file'}i.dataset.id=f.id;i.dataset.required=f.required;l.append(i);box.append(l)});q('#error').textContent='';q('#overlay').classList.add('open')}function save(status){const values={},missing=[];q('#fields').querySelectorAll('[data-id]').forEach(i=>{const v=i.type==='file'?(i.files[0]?'已选择：'+i.files[0].name:''):i.value.trim();values[i.dataset.id]=v;if(i.dataset.required==='true'&&!v)missing.push(i.dataset.id)});if(status==='reviewing'&&missing.length)return q('#error').textContent='请完整填写必填项后再提交。';if(status==='reviewing'){const c=api.canSubmit(active,api.currentApplicant());if(!c.ok)return q('#error').textContent=c.message}api.saveApp({id:'activity-'+Date.now(),nurseId:api.currentApplicant(),nurseName:ApplicantAccount.current().name||'申请人',activityPlanId:active.id,activityPlanName:active.name,formId:active.formId,formName:active.formName,formSnapshot:api.formSnapshot(active.formSnapshot),status,values,createdAt:api.now(),updatedAt:api.now()});q('#overlay').classList.remove('open');render()}q('#close').onclick=()=>q('#overlay').classList.remove('open');q('#form').onsubmit=e=>{e.preventDefault();save('reviewing')};q('#draft').onclick=()=>save('draft');render();parent.postMessage({type:'prototype:page-ready',pageId:'N12'},'*')})()</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> · 工作台</title>
<script src="/nurse-portal-source.js"></script><script src="/nurse-portal-mobile-shell.js"></script><script src="/activity-application-shared.js"></script><script src="/followup-alert-shared.js"></script><script src="/followup-form-shared.js"></script>
<style>
:root{font-family:"Haas","PingFang SC","Microsoft YaHei",sans-serif;color:#181d26}
*{box-sizing:border-box}
body{margin:0}
button,input,textarea{font:inherit}
.m-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.m-stats div{padding:12px;border:1px solid #dddddd;border-radius:10px;background:#fff;text-align:center}
.m-stats strong{display:block;font-size:20px;font-weight:500}
.m-stats span{display:block;margin-top:4px;color:#41454d;font-size:12px}
.m-task-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.m-task-section{margin-top:18px}.m-task-section:first-child{margin-top:0}.m-task-section h2{margin:0;font-size:16px;font-weight:500}.m-task-section>p{margin:5px 0 10px;color:#41454d;font-size:12px}.m-task-section .m-task-list{margin-top:0}
.m-task-card{padding:16px;border:1px solid #dddddd;border-radius:10px;background:#fff}
.m-task-card .tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px}
.m-task-card .tag.warning{background:#f4d35e;color:#181d26}
.m-task-card .tag.danger{background:#fdece5;color:#aa2d00}
.m-task-card strong{display:block;margin:8px 0 4px;font-size:15px;font-weight:500}
.m-task-card p{margin:0;color:#41454d;font-size:13px}
.m-phone-line{display:flex;align-items:center;gap:8px;margin:0 0 4px;color:#41454d;font-size:13px}
.m-task-card .m-copy-phone{width:auto;height:auto;margin:0;padding:2px 7px;border:1px solid #dddddd;border-radius:5px;background:#fff;color:#1b61c9;font-size:12px}
.m-task-card button{margin-top:12px;width:100%;height:40px;border:0;border-radius:8px;background:#181d26;color:#fff}
.m-task-card button.overdue{background:#aa2d00}
.m-empty{padding:32px 16px;border:1px dashed #cbd5dc;border-radius:10px;color:#41454d;text-align:center;font-size:13px}
.m-full{position:fixed;inset:0;z-index:20;background:#fff;display:none;flex-direction:column}
.m-full.open{display:flex}
.m-full-header{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-bottom:1px solid #dddddd}
.m-full-header button{border:0;background:transparent;color:#1b61c9;font-size:15px;padding:8px 4px}
.m-full-header h2{flex:1;margin:0;font-size:16px;font-weight:500;text-align:center}
.m-full-body{flex:1;overflow-y:auto;padding:16px}
.m-field{display:block;margin:14px 0}
.m-field span{display:block;margin-bottom:6px;font-size:13px;color:#41454d}
.m-field input,.m-field textarea{width:100%;padding:10px;border:1px solid #dddddd;border-radius:6px;font:inherit}
.m-field textarea{height:80px}
.m-submit{width:100%;height:46px;margin-top:16px;border:0;border-radius:10px;background:#181d26;color:#fff}
.m-notice{margin-top:10px;color:#aa2d00;font-size:13px}
.m-activity-notices{display:none;width:100%;margin-bottom:12px;padding:11px 12px;border:1px solid #b9c7d0;border-radius:8px;background:#fff;color:#155f8d;text-align:left}.m-activity-notices.visible{display:block}.m-notice-count{display:inline-block;min-width:17px;border-radius:99px;background:#b42318;color:#fff;font-size:11px;text-align:center}
.m-alert-summary{display:none;width:100%;margin-bottom:12px;padding:12px;border:1px solid #e7b8b0;border-radius:10px;background:#fff7f5;text-align:left}.m-alert-summary.visible{display:block}.m-alert-summary strong{display:block;color:#8f1c13}.m-alert-summary span{display:block;margin-top:4px;color:#65717a;font-size:12px}
</style></head><body>
<div class="m-full" id="full"><div class="m-full-header"><button type="button" id="full-close">取消</button><h2 id="full-title">填写随访内容</h2><span style="width:44px"></span></div><div class="m-full-body"><p id="full-hint" style="color:#41454d;font-size:13px;margin:0 0 12px"></p><form id="full-form"><label class="m-field">服务方式<select id="full-method"><option value="phone">电话随访</option><option value="offline">线下随访</option><option value="immediate">随时随访</option></select></label><div id="full-fields"></div><p class="m-notice" id="full-error"></p><button class="m-submit" type="submit" id="full-submit">提交随访</button></form></div></div>
<script>(()=>{
const source=window.NURSE_PORTAL_SOURCE
const nurseId=source.getCurrentNurseId()
const isP2=new URLSearchParams(location.search).get('phase')==='p2'
const pageId=isP2?'NM13':'NM02'
const fullOverlay=document.querySelector('#full')
const content=NursePortalMobileShell.mountShell({title:'工作台',activeTab:'NM02'})
document.body.append(fullOverlay)

const stats=document.createElement('div');stats.className='m-stats'
stats.innerHTML='<div><strong id="s-pending">0</strong><span>待执行</span></div><div><strong id="s-overdue">0</strong><span>已逾期</span></div>'
const list=document.createElement('div');list.className='m-task-list'
const notices=document.createElement('button');notices.type='button';notices.className='m-activity-notices'+(isP2?' visible':'');notices.innerHTML='活动申请通知 <b class="m-notice-count" id="m-notice-count" hidden></b>';notices.onclick=()=>NursePortalMobileShell.navigate('NM12')
const alertSummary=document.createElement('button');alertSummary.type='button';alertSummary.className='m-alert-summary'+(isP2?' visible':'');alertSummary.innerHTML='<strong>随访预警 <b id="m-alert-count"></b></strong><span id="m-alert-copy"></span>';alertSummary.onclick=()=>NursePortalMobileShell.navigate('NM14')
content.append(notices,alertSummary,stats,list)

function patientName(id){const p=source.get('patients').find(x=>x.id===id);return p?p.name:'未知患者'}
function patientById(id){return source.get('patients').find(x=>x.id===id)}
function planById(id){return source.get('plans').find(x=>x.id===id)}

function copyPhone(phone,button){
  const value=(phone||'').replace(/\s/g,'')
  const copied=()=>{
    button.textContent='已复制'
    button.disabled=true
    setTimeout(()=>{button.textContent='复制手机号';button.disabled=false},1600)
  }
  const fallback=()=>{
    const input=document.createElement('textarea')
    input.value=value
    input.setAttribute('readonly','')
    input.style.position='fixed'
    input.style.opacity='0'
    document.body.append(input)
    input.select()
    const success=document.execCommand('copy')
    input.remove()
    if(success)copied()
    else button.textContent='复制失败'
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(value).then(copied).catch(fallback)
  else fallback()
}

function render(){
  const tasks=source.get('tasks').filter(t=>t.nurseId===nurseId)
  const pendingLike=tasks.filter(t=>t.status==='due-today')
  const overdue=tasks.filter(t=>t.status==='overdue')
  document.querySelector('#s-pending').textContent=pendingLike.length
  document.querySelector('#s-overdue').textContent=overdue.length
  if(isP2){const unread=window.ActivityApplication.get('activityNotifications').filter(note=>!note.read).length;document.querySelector('#m-notice-count').textContent=unread;document.querySelector('#m-notice-count').hidden=!unread}
  if(isP2){const alerts=window.FollowupAlert.nurseAlerts(nurseId).filter(item=>item.status!=='closed');document.querySelector('#m-alert-count').textContent=alerts.length?'（'+alerts.length+'）':'';document.querySelector('#m-alert-copy').textContent=alerts.length?'点击查看本人负责患者的未关闭预警。':'当前负责患者暂无未关闭预警。'}
  list.replaceChildren()
  const todo=pendingLike.concat(overdue)
  if(!todo.length){
    const empty=document.createElement('div');empty.className='m-empty';empty.textContent='今日任务已完成，暂无待办。'
    list.append(empty);return
  }
  const groups=[
    {status:'due-today',title:'今日待随访',copy:'以下任务需在今日完成随访。'},
    {status:'overdue',title:'逾期任务',copy:'以下任务已逾期，请尽快完成补录。'}
  ]
  groups.forEach(group=>{
    const rows=todo.filter(task=>task.status===group.status)
    if(!rows.length)return
    const section=document.createElement('section');section.className='m-task-section'
    const title=document.createElement('h2');title.textContent=group.title
    const copy=document.createElement('p');copy.textContent=group.copy
    const cards=document.createElement('div');cards.className='m-task-list'
    section.append(title,copy,cards)
    rows.forEach(task=>{
    const plan=planById(task.planId)
    const patient=patientById(task.patientId)
    const card=document.createElement('article');card.className='m-task-card'
    const tag=document.createElement('span');tag.className='tag '+(task.status==='overdue'?'danger':'warning')
    tag.textContent=task.status==='overdue'?'已逾期':(task.status==='due-today'?'待执行·今日':'待执行')
    const name=document.createElement('strong');name.textContent=(patient?patient.name:'未知患者')+' · '+(plan?plan.name:'')
    const phoneLine=document.createElement('div');phoneLine.className='m-phone-line'
    const phone=document.createElement('span');phone.textContent='手机号：'+(patient?patient.phone:'--')
    const copyPhoneButton=document.createElement('button');copyPhoneButton.type='button';copyPhoneButton.className='m-copy-phone';copyPhoneButton.textContent='复制手机号'
    copyPhoneButton.disabled=!patient
    copyPhoneButton.onclick=()=>copyPhone(patient&&patient.phone,copyPhoneButton)
    phoneLine.append(phone,copyPhoneButton)
    const desc=document.createElement('p');desc.textContent='计划时间：'+task.scheduledDate
    const button=document.createElement('button');button.type='button'
    button.className=task.status==='overdue'?'overdue':''
    button.textContent=task.status==='overdue'?'补录随访':'开始随访'
    button.onclick=()=>openForm(task,plan)
    card.append(tag,name,phoneLine,desc,button)
    cards.append(card)
  })
    list.append(section)
  })
}

let current=null
function openForm(task,plan){
  current={task,plan}
  document.querySelector('#full-title').textContent=task.status==='overdue'?'补录随访内容':'填写随访内容'
  document.querySelector('#full-hint').textContent=task.status==='overdue'?'补录后会保留原任务日期与本次提交时间。':'提交后将自动更新该患者健康档案，并保留本次随访记录。'
  const fields=document.querySelector('#full-fields')
  const templateFields=(plan&&plan.templateVersionSnapshot&&plan.templateVersionSnapshot.fields)||[]
  window.FollowupForm.renderFields(fields,templateFields,{fieldClass:'m-field'})
  document.querySelector('#full-error').textContent=''
  document.querySelector('#full').classList.add('open')
}
document.querySelector('#full-close').onclick=()=>document.querySelector('#full').classList.remove('open')
document.querySelector('#full-form').onsubmit=e=>{
  e.preventDefault()
  const {values,missing}=window.FollowupForm.collectValues(document.querySelector('#full-fields'))
  if(missing){document.querySelector('#full-error').textContent='请完整填写必填项。';return}
  const tasks=source.get('tasks')
  const task=tasks.find(x=>x.id===current.task.id)
  if(task)task.status='done'
  source.set('tasks',tasks)
  const records=source.get('records')
  const record={id:'record-'+Date.now(),taskId:current.task.id,planId:current.task.planId,patientId:current.task.patientId,nurseId,templateId:current.plan.templateId,templateFields:current.plan.templateVersionSnapshot.fields,values,followupMethod:document.querySelector('#full-method').value,submittedAt:new Date().toLocaleString('sv-SE').replace('T',' ').slice(0,16),submittedAtSort:new Date().toISOString()}
  records.push(record)
  source.set('records',records)
  window.FollowupAlert.createForRecord(current.plan.templateId,record)
  document.querySelector('#full').classList.remove('open')
  render()
}

render()
parent.postMessage({type:'prototype:page-ready',pageId:pageId},'*')
})()</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> · 随访模板</title><script src="/nurse-portal-source.js"></script><script src="/nurse-portal-mobile-shell.js"></script><style>
:root{font-family:"Haas","PingFang SC","Microsoft YaHei",sans-serif;
color:#181d26}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}.actions{display:flex;
gap:8px;
margin-bottom:12px}.search{flex:1;
height:42px;
padding:0 10px;
border:1px solid #dddddd;
border-radius:8px}.primary{height:42px;
padding:0 13px;
border:0;
border-radius:8px;
background:#181d26;
color:#fff}.tabs{display:flex;
gap:6px;
margin-bottom:12px}.tabs button{flex:1;
height:38px;
border:1px solid #dddddd;
border-radius:7px;
background:#fff;
color:#41454d;
font-size:13px}.tabs button.active{border-color:#181d26;
background:#181d26;
color:#fff}.card{margin-bottom:10px;
padding:14px;
border:1px solid #dddddd;
border-radius:10px;
background:#fff}.head{display:flex;
justify-content:space-between;
gap:10px}.card h2{margin:0;
font-size:15px;
font-weight:500}.card p{margin:6px 0 0;
color:#41454d;
font-size:12px;
line-height:1.5}.tag{display:inline-block;
padding:3px 7px;
border-radius:99px;
background:#f1f3f5;
color:#41454d;
font-size:11px;
font-style:normal;
white-space:nowrap}.tag.active{background:#e7f4f1;
color:#006400}.tag.disabled{background:#fdece5;
color:#aa2d00}.ops{display:flex;
gap:14px;
margin-top:10px}.link{padding:0;
border:0;
color:#1b61c9;
background:transparent;
font-size:13px}.link.danger{color:#aa2d00}.empty{padding:28px 14px;
border:1px dashed #cbd5dc;
border-radius:10px;
color:#41454d;
text-align:center;
font-size:13px}
</style></head><body><script>(()=>{const source=window.NURSE_PORTAL_SOURCE,nurseId=source.getCurrentNurseId();
const content=NursePortalMobileShell.mountShell({title:'随访模板',showBack:true,onBack:()=>NursePortalMobileShell.navigate('NM07')});
let tab='public',keyword='';
const actions=document.createElement('div'),search=document.createElement('input'),tabs=document.createElement('div'),list=document.createElement('section');
actions.className='actions';
search.className='search';
search.placeholder='搜索模板名称';
actions.append(search);
tabs.className='tabs';
[['public','随访模板'],['disabled','已停用']].forEach(([id,label])=>{const b=document.createElement('button');
b.type='button';
b.textContent=label;
b.classList.toggle('active',id===tab);
b.onclick=()=>{tab=id;
Array.from(tabs.children).forEach(x=>x.classList.toggle('active',x===b));
render()};
tabs.append(b)});
content.append(actions,tabs,list);
function rows(){return source.get('templates').filter(t=>(tab==='public'?t.visibility==='public'&&t.status==='active':t.status==='disabled')&&t.name.includes(keyword))}function open(id){source.setEditingTemplateId(id||'');
parent.postMessage({type:'prototype:navigation-request',pageId:'NM09'},'*')}function render(){list.replaceChildren();
const data=rows();
if(!data.length){list.innerHTML='<div class="empty">暂无符合条件的随访模板。</div>';
return}data.forEach(t=>{const card=document.createElement('article');
card.className='card';
card.innerHTML='<div class="head"><div><h2>'+t.name+'</h2><p>创建人：'+t.creatorName+' · '+(t.visibility==='public'?'全部申请人可见':'仅我可见')+'</p></div><i class="tag '+(t.status==='active'?'active':'disabled')+'">'+(t.status==='active'?'启用':'已停用')+'</i></div><p>字段：'+t.fields.map(f=>f.label).join('、')+'</p><p>引用计划：'+t.usedByPlanCount+' · 更新于 '+t.updatedAt+'</p>';
const ops=document.createElement('div');
ops.className='ops';
const edit=document.createElement('button');
edit.className='link';
edit.type='button';
edit.textContent='编辑';
edit.onclick=()=>open(t.id);
ops.append(edit);
if(t.status!=='active'){const restore=document.createElement('button');
restore.className='link';
restore.type='button';
restore.textContent='恢复';
restore.onclick=()=>{const all=source.get('templates'),x=all.find(v=>v.id===t.id);
x.status='active';
source.set('templates',all);
render()};
ops.append(restore);
if(!source.get('plans').some(plan=>plan.templateId===t.id)){const remove=document.createElement('button');
remove.className='link danger';
remove.type='button';
remove.textContent='删除';
remove.onclick=()=>{if(!confirm('确认删除该未引用模板？'))return;
source.set('templates',source.get('templates').filter(x=>x.id!==t.id));
render()};
ops.append(remove)}}card.append(ops);
list.append(card)})}search.oninput=()=>{keyword=search.value.trim();
render()};
render();
parent.postMessage({type:'prototype:page-ready',pageId:'NM08'},'*')})()</script></body></html>

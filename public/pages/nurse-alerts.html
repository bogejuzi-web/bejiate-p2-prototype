<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预警提示</title><link rel="stylesheet" href="/activity-application.css"><body><div class="layout"><aside id="sidebar"></aside><main class="main"><header class="top"><div><h2>预警提示</h2><p>查看本人负责患者的随访预警和后台处理结果。</p></div></header><section class="toolbar"><select id="filter"><option value="open">未关闭</option><option value="">全部状态</option><option value="pending">待处理</option><option value="in-progress">跟进中</option><option value="closed">已关闭</option></select></section><section id="list" class="list"></section></main></div><div class="drawer" id="detail"><section class="drawer-panel"><div class="top"><div><h2>预警详情</h2><p>预警规则与后台处理信息仅供查看。</p></div><button class="secondary" id="close">关闭</button></div><section id="content" class="detail"></section></section></div><script src="/nurse-portal-source.js"></script><script src="/nurse-portal-shell.js"></script><script src="/followup-alert-shared.js"></script><script>
;(function(){const api=window.FollowupAlert,q=s=>document.querySelector(s),nurseId=window.NURSE_PORTAL_SOURCE.getCurrentNurseId();NursePortalShell.mountSidebar('#sidebar','N13');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),patient=id=>api.get('patients').find(x=>x.id===id);function render(){const filter=q('#filter').value,rows=api.nurseAlerts(nurseId).filter(x=>filter==='open'?x.status!=='closed':!filter||x.status===filter).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)),box=q('#list');box.replaceChildren();if(!rows.length){box.innerHTML='<div class="empty">暂无符合条件的预警。</div>';return}rows.forEach(item=>{const lv=api.levelMeta(item.level),st=api.statusMeta(item.status),hit=item.hits[0]||{},row=document.createElement('article');row.className='row';row.innerHTML='<div><h3>'+esc(patient(item.patientId)?.name||'未知患者')+' <i class="tag '+lv.tone+'">'+lv.label+'级</i> <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>'+esc(hit.fieldLabel)+'：'+esc(hit.value)+' · '+esc(item.createdAt)+'</p><p>'+esc(hit.ruleName||'')+'</p></div>';const view=document.createElement('button');view.className='text-btn';view.textContent='查看详情';view.onclick=()=>open(item);row.append(view);box.append(row)})}function open(item){const lv=api.levelMeta(item.level),st=api.statusMeta(item.status),hits=item.hits.map(hit=>'<dt>'+esc(hit.ruleName)+' · '+esc(hit.fieldLabel)+'</dt><dd>触发值：'+esc(hit.value)+'；条件：'+esc(api.describeCondition(hit))+'</dd>').join('');q('#content').innerHTML='<article class="card"><h3 style="margin-top:0">'+esc(patient(item.patientId)?.name||'未知患者')+' <i class="tag '+lv.tone+'">'+lv.label+'级</i> <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>触发时间：'+esc(item.createdAt)+'</p></article><dl>'+hits+'</dl>'+(item.lastHandledBy?'<article class="card"><h3 style="margin-top:0">后台处理</h3><p>最近处理：'+esc(item.lastHandledBy)+' · '+esc(item.lastHandledAt)+'</p>'+(item.closeNote?'<p>关闭说明：'+esc(item.closeNote)+'</p><p>关闭时间：'+esc(item.closedAt)+'</p>':'')+'</article>':'');q('#detail').classList.add('open')}q('#filter').onchange=render;q('#close').onclick=()=>q('#detail').classList.remove('open');render();parent.postMessage({type:'prototype:page-ready',pageId:'N13'},'*')})()
</script></body></html>

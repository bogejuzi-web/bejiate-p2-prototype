<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动申请</title><link rel="stylesheet" href="/activity-application.css"><body><div class="layout"><aside id="sidebar"></aside><main class="main"><header class="top"><div><h2>活动申请</h2><p>填写患教会议等活动申请，提交后台单级审批。</p></div><div class="ops"><button class="secondary" id="notices">审批通知 <span id="unread-count"></span></button><button class="primary" id="new-application">新建申请</button></div></header><section class="toolbar"><input id="search" placeholder="搜索活动主题"><select id="status-filter"><option value="">全部状态</option><option value="draft">草稿</option><option value="reviewing">已提交</option><option value="returned">退回补充</option><option value="approved">已通过</option><option value="rejected">已驳回</option><option value="withdrawn">已撤回</option></select></section><section id="application-list" class="list"></section></main></div><div class="drawer" id="editor-drawer"><section class="drawer-panel"><div class="top"><div><h2 id="editor-title">新建活动申请</h2><p id="editor-hint">请按当前可用表单填写，提交后将进入后台审核。</p></div><button class="secondary" id="editor-close">关闭</button></div><form id="application-form"><div id="application-fields" class="form-grid"></div><p class="error" id="application-error"></p><footer class="form-actions"><button type="button" class="secondary" id="save-draft">保存草稿</button><button type="submit" class="primary">提交申请</button></footer></form></section></div><div class="drawer" id="detail-drawer"><section class="drawer-panel"><div class="top"><div><h2>申请详情</h2><p>申请内容与审批处理信息可追溯查看。</p></div><button class="secondary" id="detail-close">关闭</button></div><section id="detail-content" class="detail"></section></section></div><script src="/nurse-portal-source.js"></script><script src="/applicant-account.js"></script><script src="/nurse-portal-shell.js"></script><script src="/activity-application-shared.js"></script><script>
;(function(){const api=window.ActivityApplication;const q=s=>document.querySelector(s);let editingId='';NursePortalShell.mountSidebar('#sidebar','N10');
function esc(v){return String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function applicantName(){return window.ApplicantAccount.current().name||'申请人'}
function render(){const keyword=q('#search').value.trim();const status=q('#status-filter').value;const rows=api.get('activityApplications').filter(x=>x.nurseId===api.currentApplicant()&&(!status||x.status===status)&&(!keyword||(x.values['activity-theme']||'').includes(keyword))).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));const box=q('#application-list');box.replaceChildren();const unread=api.get('activityNotifications').filter(x=>!x.read).length;q('#unread-count').textContent=unread?'('+unread+')':'';if(!rows.length){box.innerHTML='<div class="empty">暂无活动申请。当前有可用表单时可新建并保存草稿或提交审批。</div>';return}rows.forEach(app=>{const st=api.status(app.status,'applicant');const row=document.createElement('article');row.className='row';row.innerHTML='<div><h3>'+esc(app.values['activity-theme']||'未命名活动')+' <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>'+esc(app.formName)+' · 更新于 '+esc(app.updatedAt)+'</p>'+(app.approval?'<p>处理意见：'+esc(app.approval.comment)+'</p>':'')+'</div>';const ops=document.createElement('div');ops.className='ops';const detail=document.createElement('button');detail.className='text-btn';detail.textContent='查看详情';detail.onclick=()=>openDetail(app.id);ops.append(detail);if(app.status==='draft'||app.status==='returned'){const edit=document.createElement('button');edit.className='text-btn';edit.textContent=app.status==='returned'?'补充并重提':'编辑';edit.onclick=()=>openEditor(app);ops.append(edit)}if(app.status==='reviewing'||app.status==='returned'){const withdraw=document.createElement('button');withdraw.className='text-btn danger-text';withdraw.textContent='撤回';withdraw.onclick=()=>withdrawApp(app.id);ops.append(withdraw)}row.append(ops);box.append(row)})}
function openEditor(app){const form=app?api.formById(app.formId):api.activeForm();if(!form){alert('当前没有可用的活动申请表单，请联系管理员发布表单。');return}editingId=app?app.id:'';q('#editor-title').textContent=app?(app.status==='returned'?'补充活动申请':'编辑活动申请'):'新建活动申请';q('#editor-hint').textContent=app&&app.status==='returned'&&app.approval?'退回意见：'+app.approval.comment:'提交后将进入后台审核。';const box=q('#application-fields');box.replaceChildren();form.fields.forEach(field=>{if(field.hidden)return;const label=document.createElement('label');label.className='field full';label.innerHTML='<span>'+esc(field.label)+(field.required?'（必填）':'')+'</span>'+(field.hint?'<small style="display:block;color:#9297a0;font-size:12px;margin-top:2px">'+esc(field.hint)+'</small>':'');let input;const existingValue=(app&&app.values[field.id])||''
    if(field.type==='option'){
      input=document.createElement('select');input.innerHTML='<option value="">请选择</option>'+(field.options||[]).map(x=>'<option>'+esc(x)+'</option>').join('')
      input.value=existingValue
      input.dataset.fieldId=field.id;input.dataset.required=String(!!field.required);input.dataset.kind='option'
      label.append(input);box.append(label);return
    }
    if(field.type==='multi-option'){
      const wrap=document.createElement('div');wrap.className='multi-option-group';wrap.style.cssText='display:flex;flex-wrap:wrap;gap:14px'
      const checked=existingValue?existingValue.split('、'):[]
      ;(field.options||[]).forEach(opt=>{
        const optLabel=document.createElement('label');optLabel.style.cssText='display:flex;align-items:center;gap:6px;font-weight:400'
        const cb=document.createElement('input');cb.type='checkbox';cb.value=opt;cb.checked=checked.includes(opt)
        optLabel.append(cb,document.createTextNode(opt))
        wrap.append(optLabel)
      })
      wrap.dataset.fieldId=field.id;wrap.dataset.required=String(!!field.required);wrap.dataset.kind='multi-option'
      label.append(wrap);box.append(label);return
    }
    if(field.type==='image'){
      input=document.createElement('input');input.type='file';input.accept='image/*';const chosen=document.createElement('small');chosen.style.color='#656b75';chosen.textContent=existingValue||'仅模拟选择，不会实际上传。';input.onchange=()=>{chosen.textContent=input.files&&input.files[0]?'已选择：'+input.files[0].name:'仅模拟选择，不会实际上传。'};label.append(input,chosen);input.dataset.value=existingValue;input.dataset.fieldId=field.id;input.dataset.required=String(!!field.required);input.dataset.kind='file';box.append(label);return
    }
    if(field.type==='percentage'){
      const wrap=document.createElement('div');wrap.style.cssText='position:relative'
      input=document.createElement('input');input.type='number';input.style.paddingRight='30px';input.value=existingValue
      const suffix=document.createElement('span');suffix.textContent='%';suffix.style.cssText='position:absolute;right:11px;top:50%;transform:translateY(-50%);color:#656b75'
      wrap.append(input,suffix)
      input.dataset.fieldId=field.id;input.dataset.required=String(!!field.required);input.dataset.kind='text'
      label.append(wrap);box.append(label);return
    }
    if(field.type==='date'){
      input=document.createElement('input');input.type='date';input.value=existingValue
      input.dataset.fieldId=field.id;input.dataset.required=String(!!field.required);input.dataset.kind='text'
      label.append(input);box.append(label);return
    }
    input=document.createElement(field.type==='text'?'textarea':'input');if(field.type==='number')input.type='number'
    input.value=existingValue;input.dataset.fieldId=field.id;input.dataset.required=String(!!field.required);input.dataset.kind='text'
    label.append(input);box.append(label)});q('#application-error').textContent='';q('#editor-drawer').classList.add('open')}
function save(status){const form=editingId?api.formById(api.appById(editingId).formId):api.activeForm();if(!form){q('#application-error').textContent='当前没有可用表单。';return}const values={};let missing=false
  q('#application-fields').querySelectorAll('[data-field-id]').forEach(el=>{
    const kind=el.dataset.kind
    let value=''
    if(kind==='file')value=el.files&&el.files[0]?'已选择：'+el.files[0].name:el.dataset.value||''
    else if(kind==='multi-option')value=Array.from(el.querySelectorAll('input[type=checkbox]:checked')).map(cb=>cb.value).join('、')
    else value=el.value.trim()
    if(el.dataset.required==='true'&&!value)missing=true
    values[el.dataset.fieldId]=value
  })
  if(status==='reviewing'&&missing){q('#application-error').textContent='请完整填写必填项后再提交。';return}let app=editingId?api.appById(editingId):null;if(app){app.values=values;app.status=status;app.updatedAt=api.now()}else{app={id:'activity-'+Date.now(),formId:form.id,formName:form.name,nurseId:api.currentApplicant(),nurseName:applicantName(),status:status,values:values,createdAt:api.now(),updatedAt:api.now()}}api.saveApp(app);q('#editor-drawer').classList.remove('open');api.setSelected(app.id);render();parent.postMessage({type:'prototype:state-changed',pageId:'N10',scenarioId:status},'*')}
function withdrawApp(id){if(!confirm('确认撤回该申请？撤回后不可再次编辑、提交或审批。'))return;const app=api.appById(id);app.status='withdrawn';app.updatedAt=api.now();api.saveApp(app);q('#detail-drawer').classList.remove('open');render()}
function openDetail(id){const app=api.appById(id);if(!app)return;api.setSelected(id);const form=api.formById(app.formId)||{fields:[]};const st=api.status(app.status,'applicant');const fields=form.fields.map(f=>'<dt>'+esc(f.label)+'</dt><dd>'+esc(app.values[f.id]||'—')+'</dd>').join('');const approval=app.approval?'<section class="card"><h3 style="margin-top:0">审批处理</h3><p><i class="tag '+api.status(app.approval.result,'applicant').tone+'">'+api.status(app.approval.result,'applicant').label+'</i></p><p>'+esc(app.approval.comment)+'</p><p style="color:#656b75">'+esc(app.approval.operatorName)+' · '+esc(app.approval.processedAt)+'</p></section>':'';const actions=(app.status==='draft'||app.status==='returned'?'<button class="primary" id="detail-edit">'+(app.status==='returned'?'补充并重提':'编辑申请')+'</button>':'')+((app.status==='reviewing'||app.status==='returned')?'<button class="secondary" id="detail-withdraw">撤回申请</button>':'');q('#detail-content').innerHTML='<div class="detail-head"><div><h3>'+esc(app.values['activity-theme']||'未命名活动')+'</h3><p><i class="tag '+st.tone+'">'+st.label+'</i> · '+esc(app.updatedAt)+'</p></div></div><dl>'+fields+'</dl>'+approval+'<div class="ops">'+actions+'</div>';const edit=q('#detail-edit');if(edit)edit.onclick=()=>{q('#detail-drawer').classList.remove('open');openEditor(app)};const withdraw=q('#detail-withdraw');if(withdraw)withdraw.onclick=()=>withdrawApp(app.id);q('#detail-drawer').classList.add('open')}
q('#new-application').onclick=()=>openEditor(null);q('#notices').onclick=()=>api.navigate('N11');q('#editor-close').onclick=()=>q('#editor-drawer').classList.remove('open');q('#detail-close').onclick=()=>q('#detail-drawer').classList.remove('open');q('#save-draft').onclick=()=>save('draft');q('#application-form').onsubmit=e=>{e.preventDefault();save('reviewing')};q('#search').oninput=render;q('#status-filter').onchange=render;render();const requested=api.selected();if(requested){api.setSelected('');window.setTimeout(()=>openDetail(requested),0)}parent.postMessage({type:'prototype:page-ready',pageId:'N10'},'*')})()
</script></body></html>

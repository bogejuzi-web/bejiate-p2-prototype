<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动申请</title><link rel="stylesheet" href="/activity-application.css"><body><div class="layout"><aside id="sidebar"></aside><main class="main"><header class="top"><div><h2>活动申请</h2><p id="lead">查看历史申请或从活动计划发起申请。</p></div><div class="ops"><button class="secondary" id="notices">审批通知</button><button class="primary" id="plans">活动计划</button></div></header><section id="quota" class="notice"></section><section id="list" class="list"></section></main></div><div class="drawer" id="drawer"><section class="drawer-panel"><div class="top"><h2 id="drawer-title">活动申请</h2><button class="secondary" id="close">关闭</button></div><section id="body" class="detail"></section></section></div><script src="/nurse-portal-source.js"></script><script src="/applicant-account.js"></script><script src="/nurse-portal-shell.js"></script><script src="/activity-application-shared.js"></script><script>(()=>{const q=s=>document.querySelector(s),api=window.ActivityApplication;let selectedPlan=api.planById(api.selectedPlan()),editing=null;NursePortalShell.mountSidebar('#sidebar','N10');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function appForm(app){return app.formSnapshot||api.formById(app.formId)||{fields:[]}}function render(){const id=api.currentApplicant(),box=q('#list');box.replaceChildren();if(selectedPlan){const s=api.planStats(selectedPlan,id);q('#lead').textContent='当前从“'+selectedPlan.name+'”发起申请。';q('#quota').textContent=selectedPlan.quotaMode==='limited'?'已分配 '+s.allocated+' 场，已占用 '+s.occupied+' 场，剩余 '+s.remaining+' 场。':'不限额度，可直接提交申请。';const b=document.createElement('button');b.className='primary';b.textContent='新建计划申请';b.disabled=selectedPlan.quotaMode==='limited'&&s.remaining<=0;b.onclick=()=>openEditor(null);q('#quota').append(' ',b)}else{q('#quota').textContent='请选择活动计划后发起申请。'}api.get('activityApplications').filter(a=>a.nurseId===id).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).forEach(app=>{const st=api.status(app.status,'applicant'),row=document.createElement('article');row.className='row';row.innerHTML='<div><h3>'+esc(app.values['activity-theme']||'未命名活动')+' <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>'+(app.activityPlanName?esc(app.activityPlanName)+' · ':'')+esc(app.formName)+' · '+esc(app.updatedAt)+'</p></div>';const b=document.createElement('button');b.className='text-btn';b.textContent='详情';b.onclick=()=>openDetail(app);row.append(b);box.append(row)});if(!box.children.length)box.innerHTML='<div class="empty">暂无活动申请记录。</div>'}function openEditor(app){editing=app||null;const plan=app&&app.activityPlanId?api.planById(app.activityPlanId):selectedPlan;if(!plan){alert('请先从活动计划进入申请。');return}const form=appForm(app||{formSnapshot:plan.formSnapshot});q('#drawer-title').textContent=app?'编辑活动申请':'新建活动申请';const body=q('#body');body.innerHTML='<p class="notice">计划：'+esc(plan.name)+' · '+(plan.quotaMode==='limited'?'提交占用 1 场':'不限额度')+'</p><form id="form"><div id="fields" class="form-grid"></div><p class="error" id="error"></p><footer class="form-actions"><button type="button" class="secondary" id="draft">保存草稿</button><button class="primary">提交申请</button></footer></form>';const fields=q('#fields');form.fields.forEach(f=>{const label=document.createElement('label');label.className='field full';label.innerHTML='<span>'+esc(f.label)+(f.required?'（必填）':'')+'</span>';let input;if(f.type==='option'){input=document.createElement('select');input.innerHTML='<option value="">请选择</option>'+(f.options||[]).map(x=>'<option>'+esc(x)+'</option>').join('')}else if(f.type==='multi-option'){input=document.createElement('input');input.placeholder=(f.options||[]).join('、')}else{input=document.createElement(f.type==='text'?'textarea':'input');if(f.type==='number'||f.type==='percentage')input.type='number';if(f.type==='date')input.type='date';if(f.type==='image')input.type='file'}input.dataset.id=f.id;input.dataset.required=String(!!f.required);if(app&&f.type!=='image')input.value=app.values[f.id]||'';label.append(input);fields.append(label)});function save(status){const values={},missing=[];fields.querySelectorAll('[data-id]').forEach(input=>{const val=input.type==='file'?(input.files[0]?'已选择：'+input.files[0].name:''):input.value.trim();values[input.dataset.id]=val;if(input.dataset.required==='true'&&!val)missing.push(input.dataset.id)});if(status==='reviewing'&&missing.length){q('#error').textContent='请完整填写必填项后再提交。';return}if(status==='reviewing'){const check=api.canSubmit(plan,api.currentApplicant());if(!check.ok){q('#error').textContent=check.message;return}}const next=app||{id:'activity-'+Date.now(),nurseId:api.currentApplicant(),nurseName:window.ApplicantAccount.current().name||'申请人',createdAt:api.now(),activityPlanId:plan.id,activityPlanName:plan.name,formId:plan.formId,formName:plan.formName,formSnapshot:api.formSnapshot({id:plan.formSnapshot.id,name:plan.formSnapshot.name,version:plan.formSnapshot.version,fields:plan.formSnapshot.fields})};next.values=values;next.status=status;next.updatedAt=api.now();api.saveApp(next);q('#drawer').classList.remove('open');render()}q('#draft').onclick=()=>save('draft');q('#form').onsubmit=e=>{e.preventDefault();save('reviewing')};q('#drawer').classList.add('open')}function openDetail(app){const form=appForm(app),st=api.status(app.status,'applicant'),plan=app.activityPlanId?api.planById(app.activityPlanId):null;q('#drawer-title').textContent='申请详情';q('#body').innerHTML='<h3>'+esc(app.values['activity-theme']||'未命名活动')+'</h3><p><i class="tag '+st.tone+'">'+st.label+'</i> '+(plan?'· '+esc(plan.name):'')+'</p><dl>'+form.fields.map(f=>'<dt>'+esc(f.label)+'</dt><dd>'+esc(app.values[f.id]||'—')+'</dd>').join('')+'</dl>'+(app.approval?'<article class="card"><h3>审批处理</h3><p>'+esc(app.approval.comment)+'</p></article>':'')+'<div class="ops" id="actions"></div>';const actions=q('#actions');if(['draft','returned'].includes(app.status)){const e=document.createElement('button');e.className='primary';e.textContent='编辑';e.onclick=()=>openEditor(app);actions.append(e)}if(['reviewing','returned'].includes(app.status)){const w=document.createElement('button');w.className='secondary';w.textContent='撤回';w.onclick=()=>{if(confirm('确认撤回？')){app.status='withdrawn';app.updatedAt=api.now();api.saveApp(app);q('#drawer').classList.remove('open');render()}};actions.append(w)}q('#drawer').classList.add('open')}q('#close').onclick=()=>q('#drawer').classList.remove('open');q('#plans').onclick=()=>api.navigate('N12');q('#notices').onclick=()=>api.navigate('N11');render();if(selectedPlan)openEditor(null);parent.postMessage({type:'prototype:page-ready',pageId:'N10'},'*')})()</script></body></html>

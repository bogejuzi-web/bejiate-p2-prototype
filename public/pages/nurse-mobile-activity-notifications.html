<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动申请通知（手机端）</title><body><script src="/nurse-portal-source.js"></script><script src="/nurse-portal-mobile-shell.js"></script><script src="/activity-application-shared.js"></script><script>
;(function(){const api=window.ActivityApplication;const style=document.createElement('style');style.textContent='.notice{display:block;width:100%;padding:14px;margin-bottom:10px;text-align:left;border:1px solid #e2e8ec;border-radius:10px;background:#fff;font:inherit}.notice.unread{border-left:4px solid #155f8d}.notice h3{margin:0 0 7px;font-size:16px}.notice p{margin:5px 0;color:#65717a;font-size:13px;line-height:1.5}.tag{display:inline-block;padding:2px 7px;border-radius:99px;font-size:12px;font-style:normal}.success{background:#e5f6eb;color:#19733a}.warning{background:#fff4db;color:#9c6500}.danger{background:#ffebe9;color:#b42318}.empty{padding:28px 16px;text-align:center;color:#65717a;background:#fff;border-radius:10px}';document.head.append(style);const content=NursePortalMobileShell.mountShell({title:'活动通知',activeTab:'NM06'});function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const rows=api.get('activityNotifications'),box=document.createElement('div');if(!rows.length)box.innerHTML='<div class="empty">暂无活动申请审批通知。</div>';rows.forEach(note=>{const st=api.status(note.result,'nurse'),b=document.createElement('button');b.className='notice'+(!note.read?' unread':'');b.innerHTML='<h3>'+esc(note.title)+' <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>'+esc(note.content)+'</p><p>'+esc(note.createdAt)+(!note.read?' · 未读':'')+'</p>';b.onclick=()=>{const notes=api.get('activityNotifications'),target=notes.find(x=>x.id===note.id);if(target){target.read=true;api.set('activityNotifications',notes)}api.setSelected(note.applicationId);NursePortalMobileShell.navigate('NM11')};box.append(b)});content.replaceChildren(box)}render();parent.postMessage({type:'prototype:page-ready',pageId:'NM12'},'*')})()
</script></body></html>

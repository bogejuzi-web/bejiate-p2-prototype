<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> · 评分管理</title><script src="/nurse-portal-source.js"></script><script src="/admin-portal-shell.js"></script><link rel="stylesheet" href="/nurse-portal-layout.css"><style>
.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{padding:9px 14px;border:1px solid #ddd;border-radius:7px;background:#fff}.tabs button.active{background:#181d26;color:#fff;border-color:#181d26}.view[hidden]{display:none}.layout{display:grid;grid-template-columns:300px 1fr;gap:20px}.panel-card{padding:18px;border:1px solid #ddd;border-radius:10px;background:#fff}.stage{display:block;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;background:#fff;text-align:left;margin-top:8px}.stage.active{border-color:#181d26;background:#f4f6f8}.stage strong,.stage span{display:block}.stage span{margin-top:4px;color:#6d727c;font-size:12px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field-grid .field{margin:0}.goals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:16px 0}.goal{padding:12px;border-radius:8px;background:#f4f6f8}.goal span{display:block;color:#41454d;font-size:12px}.goal input{width:100%;margin-top:8px;border:1px solid #ddd;border-radius:5px;padding:7px;box-sizing:border-box}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.toolbar select{height:38px;border:1px solid #ddd;border-radius:6px;padding:0 8px;background:#fff}.table{border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff}.row{display:grid;grid-template-columns:1.1fr 1fr repeat(5,.8fr) .8fr;gap:8px;align-items:center;padding:13px 16px;border-bottom:1px solid #eee;font-size:13px}.row.head{background:#f7f8fa;color:#41454d;font-size:12px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;font-size:12px}.pass{background:#e6f5eb;color:#147a3e}.fail{background:#fff0ed;color:#b44226}.stage-target{margin:0 0 14px;color:#41454d;font-size:13px}.notice{min-height:18px;color:#b44226;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}.goals{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><aside class="side"></aside><section class="main" data-change-id="A07-C01"><header class="top"><h1>评分管理</h1></header><nav class="tabs"><button class="active" data-view="settings">评分设置</button><button data-view="scores">申请人评分查看</button></nav>
<section class="view" id="settings-view"><div class="layout"><aside class="panel-card"><strong>评分阶段</strong><div id="stage-list"></div><button class="primary" id="new-stage" style="width:100%;margin-top:12px">新建评分阶段</button></aside><form class="panel-card" id="stage-form"><h2 id="form-title" style="margin-top:0">新建评分阶段</h2><div class="field-grid"><label class="field">阶段名称<input id="stage-name" required></label><label class="field">开始日期<input id="stage-start" type="date" required></label><label class="field">持续月份<select id="stage-months">${Array.from({length:12},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+' 个月</option>').join('')}</select></label><label class="field">及格线（%）<input id="passing-rate" type="number" min="0" max="100" value="60" required></label></div><p class="stage-target" id="stage-range"></p><h3 style="font-size:15px">阶段指标目标</h3><div class="goals"><label class="goal"><span>随访次数</span><input id="goal-followup" type="number" min="0" required></label><label class="goal"><span>随访覆盖率（%）</span><input id="goal-coverage" type="number" min="0" max="100" required></label><label class="goal"><span>线下跟诊数</span><input id="goal-offline" type="number" min="0" required></label><label class="goal"><span>电话随访数</span><input id="goal-phone" type="number" min="0" required></label><label class="goal"><span>入组人数</span><input id="goal-enrolled" type="number" min="0" required></label></div><p class="notice" id="form-error"></p><div class="actions"><button type="button" id="reset-form">取消</button><button class="primary" type="submit">保存阶段目标</button></div></form></div></section>
<section class="view" id="scores-view" hidden><div class="toolbar"><select id="score-stage"></select><select id="score-nurse"><option value="">全部申请人</option></select><select id="score-pass"><option value="">全部结果</option><option value="pass">及格</option><option value="fail">未及格</option></select><button id="export" type="button">导出 CSV</button></div><p class="stage-target" id="score-target"></p><section class="table"><div class="row head"><span>申请人</span><span>阶段目标</span><span>随访次数</span><span>覆盖率</span><span>线下</span><span>电话</span><span>入组</span><span>结果</span></div><div id="score-list"></div></section></section>
</section></main><script>(()=>{const q=s=>document.querySelector(s),source=window.NURSE_PORTAL_SOURCE;AdminPortalShell.mountSidebar('.side','A07');let editingId=null;const fmt=d=>d?d.replace(/(\d{4})-(\d{2})-(\d{2})/,'$1年$2月$3日'):'';const end=(start,months)=>{const d=new Date(start+'T00:00:00');d.setMonth(d.getMonth()+Number(months));d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)};const stages=()=>source.get('scoreStages').sort((a,b)=>b.startDate.localeCompare(a.startDate));function updateRange(){const start=q('#stage-start').value,months=q('#stage-months').value;q('#stage-range').textContent=start?'目标周期：'+fmt(start)+' 至 '+fmt(end(start,months)):''}function fill(stage){editingId=stage&&stage.id;q('#form-title').textContent=stage?'编辑评分阶段':'新建评分阶段';q('#stage-name').value=stage?stage.name:'';q('#stage-start').value=stage?stage.startDate:'2026-10-01';q('#stage-months').value=stage?stage.durationMonths:3;q('#passing-rate').value=stage?stage.passingRate:60;const g=stage?stage.goals:{followupCount:3,coverage:80,offlineCount:2,phoneCount:2,enrolledCount:3};q('#goal-followup').value=g.followupCount;q('#goal-coverage').value=g.coverage;q('#goal-offline').value=g.offlineCount;q('#goal-phone').value=g.phoneCount;q('#goal-enrolled').value=g.enrolledCount;updateRange()}function renderStages(){const box=q('#stage-list');box.replaceChildren();stages().forEach(stage=>{const b=document.createElement('button');b.type='button';b.className='stage'+(stage.id===editingId?' active':'');b.innerHTML='<strong>'+stage.name+'</strong><span>'+fmt(stage.startDate)+' 至 '+fmt(stage.endDate)+' · '+stage.durationMonths+' 个月</span>';b.onclick=()=>{fill(stage);renderStages()};box.append(b)});renderScoreControls()}function renderScoreControls(){const select=q('#score-stage'),selected=select.value;select.replaceChildren();stages().forEach(stage=>{const o=document.createElement('option');o.value=stage.id;o.textContent=stage.name+' · '+fmt(stage.startDate)+' 至 '+fmt(stage.endDate);select.append(o)});if(selected)select.value=selected;const nurses=q('#score-nurse');if(nurses.options.length===1)source.get('nurses').filter(n=>n.status!=='disabled').forEach(n=>{const o=document.createElement('option');o.value=n.id;o.textContent=n.name;nurses.append(o)});renderScores()}function metrics(nurseId,stage){const records=source.get('records').filter(r=>r.nurseId===nurseId&&r.submittedAt.slice(0,10)>=stage.startDate&&r.submittedAt.slice(0,10)<=stage.endDate);const bound=source.get('bindings').filter(b=>b.nurseId===nurseId&&b.status==='bound').map(b=>b.patientId);const covered=new Set(records.filter(r=>bound.includes(r.patientId)).map(r=>r.patientId)).size;return {followup:records.length,coverage:bound.length?Math.round(covered/bound.length*100):0,offline:records.filter(r=>r.followupMethod==='offline').length,phone:records.filter(r=>r.followupMethod==='phone').length,enrolled:bound.length}}function renderScores(){const stage=stages().find(s=>s.id===q('#score-stage').value)||stages()[0];if(!stage)return;const g=stage.goals;q('#score-target').textContent='当前阶段目标：随访 '+g.followupCount+' 次 · 覆盖率 '+g.coverage+'% · 线下 '+g.offlineCount+' 次 · 电话 '+g.phoneCount+' 次 · 入组 '+g.enrolledCount+' 人 · 及格线 '+stage.passingRate+'%';const list=q('#score-list');list.replaceChildren();const nurseFilter=q('#score-nurse').value,passFilter=q('#score-pass').value;source.get('nurses').filter(n=>n.status!=='disabled'&&(!nurseFilter||n.id===nurseFilter)).forEach(n=>{const m=metrics(n.id,stage),ratios=[m.followup/g.followupCount,m.coverage/g.coverage,m.offline/g.offlineCount,m.phone/g.phoneCount,m.enrolled/g.enrolledCount],rate=Math.round(ratios.reduce((a,b)=>a+b,0)/ratios.length*100),passed=rate>=stage.passingRate;if(passFilter&&passFilter!==(passed?'pass':'fail'))return;const row=document.createElement('div');row.className='row';row.innerHTML='<span>'+n.name+'</span><span>'+stage.name+'</span><span>'+m.followup+'/'+g.followupCount+'</span><span>'+m.coverage+'%/'+g.coverage+'%</span><span>'+m.offline+'/'+g.offlineCount+'</span><span>'+m.phone+'/'+g.phoneCount+'</span><span>'+m.enrolled+'/'+g.enrolledCount+'</span><span><i class="tag '+(passed?'pass':'fail')+'">'+(passed?'及格':'未及格')+' '+rate+'%</i></span>';list.append(row)})}q('#stage-start').onchange=updateRange;q('#stage-months').onchange=updateRange;q('#new-stage').onclick=()=>{fill(null);renderStages()};q('#reset-form').onclick=()=>{fill(null);renderStages()};q('#stage-form').onsubmit=e=>{e.preventDefault();const start=q('#stage-start').value,months=Number(q('#stage-months').value),all=source.get('scoreStages'),stage={id:editingId||'stage-'+Date.now(),name:q('#stage-name').value.trim(),startDate:start,endDate:end(start,months),durationMonths:months,passingRate:Number(q('#passing-rate').value),goals:{followupCount:Number(q('#goal-followup').value),coverage:Number(q('#goal-coverage').value),offlineCount:Number(q('#goal-offline').value),phoneCount:Number(q('#goal-phone').value),enrolledCount:Number(q('#goal-enrolled').value)},updatedAt:'2026-09-09 刚刚'};if(editingId){const i=all.findIndex(x=>x.id===editingId);all[i]=stage}else all.push(stage);source.set('scoreStages',all);fill(stage);renderStages()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));q('#settings-view').hidden=b.dataset.view!=='settings';q('#scores-view').hidden=b.dataset.view!=='scores';renderScores()});q('#score-stage').onchange=renderScores;q('#score-nurse').onchange=renderScores;q('#score-pass').onchange=renderScores;q('#export').onclick=()=>{const rows=[['申请人','阶段','随访次数','覆盖率','线下跟诊','电话随访','入组人数','结果']];q('#score-list').querySelectorAll('.row').forEach(r=>rows.push(Array.from(r.children).map(c=>c.textContent.trim())));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='申请人评分.csv';a.click();URL.revokeObjectURL(a.href)};fill(stages()[0]);renderStages();parent.postMessage({type:'prototype:page-ready',pageId:'A07'},'*')})()</script></body></html>

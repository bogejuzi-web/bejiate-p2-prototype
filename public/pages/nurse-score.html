<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> · 评分</title>
<script src="/nurse-portal-source.js"></script><script src="/nurse-portal-shell.js"></script>
<link rel="stylesheet" href="/nurse-portal-layout.css">
<style>
.score-stage{margin-top:22px}.stage-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}.stage-heading h2{margin:0;font-size:16px}.stage-toggle{min-width:64px;padding:6px 12px;border:1px solid #d9dde3;border-radius:6px;background:#fff;color:#41454d;cursor:pointer}.score-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:14px}.score-stage.collapsed .score-grid{display:none}
.score-card{padding:24px;border:1px solid #dddddd;border-radius:10px;background:#fff}
.score-card span{display:block;color:#41454d;font-size:13px}
.score-card strong{display:block;margin-top:10px;font-size:32px;font-weight:500}
.progress-track{margin-top:14px;height:8px;border-radius:999px;background:#eef0f2;overflow:hidden}
.progress-fill{height:100%;background:#181d26;border-radius:999px}
.score-note{margin-top:20px;padding:14px 16px;border:1px dashed #cbd5dc;border-radius:8px;color:#41454d;font-size:13px}
@media(max-width:1000px){.score-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.score-grid{grid-template-columns:1fr}}
</style></head><body><main class="app"><aside class="side"></aside><section class="main" data-change-id="N08-C01">
<header class="top"><div><p class="eyebrow" id="period-label"></p><h1>评分</h1></div></header>
<div id="score-content"></div>
</section></main>
<script>(()=>{
const q=s=>document.querySelector(s)
const source=window.NURSE_PORTAL_SOURCE
const nurseId=source.getCurrentNurseId()
NursePortalShell.mountSidebar('.side','N08')

function render(){
  const box=q('#score-content')
  const stages=source.get('scoreStages').slice().sort((a,b)=>b.startDate.localeCompare(a.startDate))
  q('#period-label').textContent='按评分阶段查看'
  box.innerHTML=stages.map(stage=>{const records=source.get('records').filter(r=>r.nurseId===nurseId&&r.submittedAt.slice(0,10)>=stage.startDate&&r.submittedAt.slice(0,10)<=stage.endDate);const bound=source.get('bindings').filter(b=>b.nurseId===nurseId&&b.status==='bound').map(b=>b.patientId);const covered=new Set(records.filter(r=>bound.includes(r.patientId)).map(r=>r.patientId)).size;const coverage=bound.length?Math.round(covered/bound.length*100):0;const values=[['随访次数',records.length,stage.goals.followupCount,'次'],['随访覆盖率',coverage,stage.goals.coverage,'%'],['线下跟诊数',records.filter(r=>r.followupMethod==='offline').length,stage.goals.offlineCount,'次'],['电话随访数',records.filter(r=>r.followupMethod==='phone').length,stage.goals.phoneCount,'次'],['入组人数',bound.length,stage.goals.enrolledCount,'人']];return '<section class="score-stage"><div class="stage-heading"><h2>'+stage.name+' · '+stage.startDate+' 至 '+stage.endDate+'</h2><button class="stage-toggle" type="button" aria-expanded="true">收起</button></div><div class="score-grid">'+values.map(v=>'<div class="score-card"><span>'+v[0]+'</span><strong>'+v[1]+'</strong><p style="margin:8px 0 0;color:#6d727c;font-size:13px">目标 '+v[2]+v[3]+'</p></div>').join('')+'</div></section>'}).join('')||'<div class="empty">暂无评分阶段。</div>'
}

render()
q('#score-content').addEventListener('click',event=>{const button=event.target.closest('.stage-toggle');if(!button)return;const stage=button.closest('.score-stage');const collapsed=stage.classList.toggle('collapsed');button.textContent=collapsed?'展开':'收起';button.setAttribute('aria-expanded',String(!collapsed))})
parent.postMessage({type:'prototype:page-ready',pageId:'N08'},'*')
})()</script></body></html>

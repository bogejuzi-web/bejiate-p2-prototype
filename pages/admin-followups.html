<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> · 随访管理</title>
<script src="../nurse-portal-source.js"></script><script src="../followup-analysis.js"></script><script src="../admin-portal-shell.js"></script>
<link rel="stylesheet" href="../nurse-portal-layout.css">
<style>
html,body{height:100%}.app{height:100vh}.main{max-width:none;padding:0;overflow:hidden;position:relative}.followup-frame{display:block;width:100%;height:100%;border:0;background:#f8fafc}.analysis-open{position:absolute;top:14px;right:16px;z-index:2;padding:9px 12px;border:0;border-radius:7px;background:#181d26;color:#fff}.admin-analysis{position:absolute;inset:0;z-index:4;display:none;overflow:auto;padding:24px;background:#f8fafc}.admin-analysis.open{display:block}.analysis-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.analysis-head h2{margin:0;font-size:21px}.analysis-head p{margin:6px 0;color:#69717d}.analysis-filter{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.analysis-filter input,.analysis-filter select{padding:8px;border:1px solid #d9dde3;border-radius:6px;background:#fff}.analysis-summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px}.analysis-summary div,.analysis-row{padding:13px;border:1px solid #e2e7ec;border-radius:8px;background:#fff}.analysis-summary span{display:block;color:#69717d;font-size:12px}.analysis-summary b{display:block;margin-top:7px;font-size:17px}.analysis-list{display:grid;gap:9px;margin-top:18px}.analysis-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.analysis-row p{margin:6px 0 0;color:#69717d;font-size:13px}.analysis-row button{padding:8px 11px;border:1px solid #d9dde3;border-radius:6px;background:#fff;color:#1b61c9}.analysis-empty{padding:28px;border:1px dashed #cbd5dc;border-radius:8px;color:#69717d;text-align:center}
</style></head><body><main class="app"><aside class="side"></aside><section class="main" data-change-id="A06-C01"><iframe class="followup-frame" id="followup-frame" title="随访管理" src="../pages/nurse-followups.html?adminMode=1"></iframe></section></main>
<script>(()=>{
  AdminPortalShell.mountSidebar('.side','A06')
  const frame=document.querySelector('#followup-frame')
  const source=window.NURSE_PORTAL_SOURCE, analysis=window.FollowupAnalysis
  const main=document.querySelector('.main')
  main.insertAdjacentHTML('beforeend','<button class="analysis-open" id="open-analysis">服务分析</button><section class="admin-analysis" id="analysis"><div class="analysis-head"><div><h2>随访服务分析</h2><p>按患者、负责申请人、模板与时间查看服务汇总和记录。</p></div><button id="close-analysis">返回随访管理</button></div><div class="analysis-filter"><input id="filter-patient" placeholder="搜索患者"><select id="filter-nurse"><option value="">全部申请人</option></select><select id="filter-template"><option value="">全部模板</option></select><input id="filter-start" type="date" aria-label="开始日期"><input id="filter-end" type="date" aria-label="结束日期"><button id="clear-filters">清除筛选</button></div><div id="analysis-summary"></div><section class="analysis-list" id="analysis-list"></section></section>')
  const q=s=>document.querySelector(s);const filters={patient:'',nurseId:'',templateId:'',start:'',end:''}
  q('#filter-nurse').innerHTML+=[...source.get('nurses')].map(n=>'<option value="'+n.id+'">'+n.name+'</option>').join('')
  q('#filter-template').innerHTML+=source.get('templates').map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('')
  function renderAnalysis(){filters.patient=q('#filter-patient').value.trim();filters.nurseId=q('#filter-nurse').value;filters.templateId=q('#filter-template').value;filters.start=q('#filter-start').value;filters.end=q('#filter-end').value;const rows=analysis.records(filters).filter(r=>{const patient=source.get('patients').find(p=>p.id===r.patientId);return !filters.patient||(patient&&((patient.name+patient.phone+patient.patientNo).includes(filters.patient)))});const count={total:rows.length,phone:rows.filter(r=>r.followupMethod==='phone').length,offline:rows.filter(r=>r.followupMethod==='offline').length,immediate:rows.filter(r=>r.followupMethod==='immediate').length,latest:rows.length?rows[rows.length-1].submittedAt:''};q('#analysis-summary').innerHTML=analysis.overview(count);const patients=[...new Set(rows.map(r=>r.patientId))].map(id=>source.get('patients').find(p=>p.id===id)).filter(Boolean);q('#analysis-list').innerHTML=patients.length?patients.map(patient=>{const result=analysis.analyze(patient.id,filters);return '<article class="analysis-row"><div><strong>'+patient.name+' · '+patient.patientNo+'</strong><p>随访 '+result.overview.total+' 次 · 最近 '+(result.overview.latest||'暂无')+'</p></div><button data-patient="'+patient.id+'">查看患者分析</button></article>'}).join(''):'<div class="analysis-empty">暂无符合条件的随访记录。请调整或清除筛选条件。</div>';q('#analysis-list').querySelectorAll('[data-patient]').forEach(button=>button.onclick=()=>{source.setSelectedPatientId(button.dataset.patient);const query=new URLSearchParams({analysis:'1',start:filters.start,end:filters.end,template:filters.templateId,nurse:filters.nurseId});frame.src='../pages/nurse-patient-detail.html?'+query.toString();q('#analysis').classList.remove('open');q('#open-analysis').hidden=false})}
  ;['#filter-patient','#filter-nurse','#filter-template','#filter-start','#filter-end'].forEach(selector=>q(selector).onchange=renderAnalysis);q('#filter-patient').oninput=renderAnalysis;q('#clear-filters').onclick=()=>{['filter-patient','filter-nurse','filter-template','filter-start','filter-end'].forEach(id=>q('#'+id).value='');renderAnalysis()};q('#open-analysis').onclick=()=>{renderAnalysis();q('#analysis').classList.add('open');q('#open-analysis').hidden=true};q('#close-analysis').onclick=()=>{q('#analysis').classList.remove('open');q('#open-analysis').hidden=false}
  frame.addEventListener('load',()=>{
    const doc=frame.contentDocument
    const side=doc.querySelector('.side')
    if(side)side.remove()
    const app=doc.querySelector('.app')
    if(app)app.style.gridTemplateColumns='1fr'
  })
  window.addEventListener('message',event=>{
    if(event.source===frame.contentWindow&&event.data&&event.data.type==='prototype:navigation-request'){
      parent.postMessage(event.data,'*')
    }
  })
  parent.postMessage({type:'prototype:page-ready',pageId:'A06'},'*')
})()</script></body></html>

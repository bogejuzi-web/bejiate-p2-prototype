<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> · 患者详情</title>
<script src="../nurse-portal-source.js"></script><script src="../admin-portal-shell.js"></script>
<link rel="stylesheet" href="../nurse-portal-layout.css">
<style>
.back{border:0;background:transparent;color:#1b61c9;font-size:14px;padding:0}.profile{display:flex;justify-content:space-between;align-items:center;margin:20px 0 24px;padding:24px;border:1px solid #dddddd;border-radius:10px;background:#fff}.profile h1{margin:0;font-size:28px;font-weight:400}.profile p{margin:8px 0 0;color:#41454d}.profile-actions{display:flex;align-items:center;gap:10px}.profile-actions button{padding:9px 12px;border:1px solid #dddddd;border-radius:7px;background:#fff;color:#1b61c9;font-size:13px}.panel{width:100%;max-width:none;padding:28px;border:1px solid #dddddd;border-radius:10px;background:#fff}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel h2{margin:0 0 20px;font-size:20px;font-weight:400}.panel-head h2{margin:0}.health-sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}.health-section{padding:18px;border:1px solid #eef0f2;border-radius:8px;background:#f8fafc}.health-section h3{margin:0 0 16px;font-size:15px;font-weight:500}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}.item span{display:block;color:#41454d;font-size:13px}.item strong{display:block;margin-top:8px;font-size:16px;font-weight:500}.empty{padding:28px 14px;border:1px dashed #cbd5dc;border-radius:10px;color:#41454d;text-align:center}.consent-modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(24,29,38,.35)}.consent-modal.open{display:flex}.consent-dialog{width:min(720px,100%);max-height:min(720px,90vh);overflow:auto;padding:24px;border-radius:10px;background:#fff}.consent-dialog header{display:flex;align-items:center;justify-content:space-between;gap:14px}.consent-dialog h2{margin:0;font-size:20px;font-weight:400}.consent-dialog header button{border:0;background:transparent;color:#1b61c9;font-size:14px}.consent-tabs{display:flex;gap:8px;margin:20px 0 16px;overflow:auto}.consent-tabs button{flex:0 0 auto;padding:9px 12px;border:1px solid #dddddd;border-radius:7px;background:#fff;text-align:left}.consent-tabs button.active{border-color:#181d26;background:#f4f6f8}.consent-tabs small{display:block;margin-top:3px;color:#41454d}.consent-status{display:inline-block;margin:0 0 14px;padding:4px 8px;border-radius:999px;background:#e7f4f1;color:#006400;font-size:12px}.consent-status.unsigned{background:#fff3cc;color:#765a00}.consent-content{padding:18px;border:1px solid #eef0f2;border-radius:8px;background:#f8fafc;color:#333840;line-height:1.8;font-size:14px}@media(max-width:800px){.profile{align-items:flex-start}.profile-actions{flex-wrap:wrap;justify-content:flex-end}.health-sections,.grid{grid-template-columns:1fr}}
</style></head><body><main class="app"><aside class="side"></aside><section class="main" data-change-id="AD01-C01"><button class="back" id="back">‹ 返回患者管理</button><header class="profile"><div><h1 id="patient-name"></h1><p id="patient-meta"></p></div><div class="profile-actions"><button id="go-plans" type="button">随访计划</button><button id="view-consents" type="button">协议签署详情</button><span class="tag muted" id="patient-tag"></span></div></header><article class="panel" id="panel"></article></section></main><div class="consent-modal" id="consent-modal"><section class="consent-dialog" role="dialog" aria-modal="true" aria-labelledby="consent-title"><header><h2 id="consent-title">协议签署详情</h2><button id="close-consents" type="button">关闭</button></header><div class="consent-tabs" id="consent-tabs"></div><div id="consent-detail"></div></section></div><script>(()=>{
const q=s=>document.querySelector(s),source=window.NURSE_PORTAL_SOURCE
AdminPortalShell.mountSidebar('.side','A05')
const patientId=source.getSelectedPatientId()||'patient-001',patient=source.get('patients').find(p=>p.id===patientId)||source.get('patients')[0]
function renderProfile(){q('#patient-name').textContent=patient.name;q('#patient-meta').textContent=patient.phone+' · 患者编号 '+patient.patientNo;const binding=source.get('bindings').find(item=>item.patientId===patient.id&&item.status==='bound'),tag=q('#patient-tag');tag.className='tag '+(binding?'success':'muted');tag.textContent=binding?'已绑定':'未绑定'}
function renderHealth(){const panel=q('#panel'),health=source.getHealthRecord(patient.id);if(!health||!health.record){panel.innerHTML='<h2>健康档案</h2><div class="empty">该患者暂无健康档案。</div>';return}let html='<div class="panel-head"><h2>健康档案</h2></div><p style="color:#41454d;font-size:13px;margin:12px 0 0">最近更新：'+health.record.updatedAt+'</p><div class="health-sections">';health.record.sections.forEach(section=>{html+='<section class="health-section"><h3>'+section.title+'</h3><div class="grid">';section.fields.forEach(field=>{html+='<div class="item"><span>'+field.label+'</span><strong>'+(field.value===undefined?'':field.value)+'</strong></div>'});html+='</div></section>'});panel.innerHTML=html+'</div>'}
function renderConsents(){const rows=source.get('consents').filter(item=>item.patientId===patient.id),tabs=q('#consent-tabs'),detail=q('#consent-detail');tabs.replaceChildren();if(!rows.length){detail.innerHTML='<div class="empty">该患者暂无协议记录。</div>';return}let selected=rows[0];const draw=()=>{detail.innerHTML='<i class="consent-status '+(selected.status==='signed'?'':'unsigned')+'">'+(selected.status==='signed'?'已签署 · '+selected.signedAt:'待签署')+'</i><div class="consent-content">'+selected.content+'</div>';tabs.querySelectorAll('button').forEach(button=>button.classList.toggle('active',button.dataset.id===selected.id))};rows.forEach(row=>{const button=document.createElement('button');button.type='button';button.dataset.id=row.id;button.innerHTML='<strong>'+row.title+' '+row.version+'</strong><small>'+(row.status==='signed'?'已签署':'待签署')+'</small>';button.onclick=()=>{selected=row;draw()};tabs.append(button)});draw()}
q('#back').onclick=()=>parent.postMessage({type:'prototype:navigation-request',pageId:'A05'},'*');q('#go-plans').onclick=()=>{source.setSelectedPatientId(patient.id);parent.postMessage({type:'prototype:navigation-request',pageId:'A06'},'*')};q('#view-consents').onclick=()=>{renderConsents();q('#consent-modal').classList.add('open')};q('#close-consents').onclick=()=>q('#consent-modal').classList.remove('open');q('#consent-modal').onclick=event=>{if(event.target===q('#consent-modal'))q('#consent-modal').classList.remove('open')};renderProfile();renderHealth();parent.postMessage({type:'prototype:page-ready',pageId:'AD01'},'*')
})()</script></body></html>

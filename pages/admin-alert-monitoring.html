<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>预警监控</title><link rel="stylesheet" href="../activity-application.css">
<body>
  <div class="layout"><aside id="sidebar"></aside><main class="main">
    <header class="top"><div><h2>预警监控</h2><p>查看随访触发的预警，跟进、随访或关闭需处理事项。</p></div></header>
    <section class="toolbar"><select id="level"><option value="">全部等级</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select><select id="status"><option value="">全部状态</option><option value="pending">待处理</option><option value="in-progress">跟进中</option><option value="closed">已关闭</option></select><input id="from" type="date" aria-label="开始日期"><input id="to" type="date" aria-label="结束日期"></section>
    <section id="list" class="list"></section>
  </main></div>
  <div class="drawer" id="detail"><section class="drawer-panel"><div class="top"><div><h2>预警详情</h2><p>处理过程与规则快照可追溯查看。</p></div><button class="secondary" id="detail-close">关闭</button></div><section id="detail-content" class="detail"></section></section></div>
  <div class="modal" id="close-modal"><form class="modal-panel" id="close-form"><h2 style="margin-top:0">关闭预警</h2><p style="color:#656b75">请填写处理说明；关闭后该预警将不再计入申请人端未关闭数量。</p><label class="field"><span>处理说明（必填）</span><textarea id="close-note" required></textarea></label><p class="error" id="close-error"></p><div class="form-actions"><button type="button" class="secondary" id="close-cancel">取消</button><button class="primary" type="submit">确认关闭</button></div></form></div>
  <script src="../nurse-portal-source.js"></script><script src="../admin-portal-shell.js"></script><script src="../followup-alert-shared.js"></script><script src="../followup-form-shared.js"></script><script src="../admin-immediate-followup.js"></script>
  <script>
  ;(function () {
    const api=window.FollowupAlert,q=s=>document.querySelector(s);let selectedId=''
    AdminPortalShell.mountSidebar('#sidebar','A14')
    const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
    const patient=id=>api.get('patients').find(x=>x.id===id),nurse=id=>api.get('nurses').find(x=>x.id===id)
    function render(){const level=q('#level').value,status=q('#status').value,from=q('#from').value,to=q('#to').value,rows=api.get('followupAlerts').filter(x=>(!level||x.level===level)&&(!status||x.status===status)&&(!from||x.createdAt.slice(0,10)>=from)&&(!to||x.createdAt.slice(0,10)<=to)).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)),box=q('#list');box.replaceChildren();if(!rows.length){box.innerHTML='<div class="empty">暂无符合条件的预警。</div>';return}rows.forEach(alert=>{const lv=api.levelMeta(alert.level),st=api.statusMeta(alert.status),hit=alert.hits[0]||{},row=document.createElement('article');row.className='row';row.innerHTML='<div><h3>'+esc(patient(alert.patientId)?.name||'未知患者')+' <i class="tag '+lv.tone+'">'+lv.label+'级</i> <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>'+esc(nurse(alert.nurseId)?.name||'未知申请人')+' · '+esc(hit.fieldLabel)+'：'+esc(hit.value)+' · '+esc(alert.createdAt)+'</p><p>'+esc(hit.ruleName||'')+'</p></div>';const button=document.createElement('button');button.className='text-btn';button.textContent='查看详情';button.onclick=()=>openDetail(alert.id);row.append(button);box.append(row)})}
    function openDetail(id){const item=api.get('followupAlerts').find(x=>x.id===id);if(!item)return;selectedId=id;const lv=api.levelMeta(item.level),st=api.statusMeta(item.status),hits=item.hits.map(hit=>'<dt>'+esc(hit.ruleName)+' · '+esc(hit.fieldLabel)+'</dt><dd>触发值：'+esc(hit.value)+'；条件：'+esc(api.describeCondition(hit))+'</dd>').join('');q('#detail-content').innerHTML='<article class="card"><h3 style="margin-top:0">'+esc(patient(item.patientId)?.name||'未知患者')+' <i class="tag '+lv.tone+'">'+lv.label+'级</i> <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>负责申请人：'+esc(nurse(item.nurseId)?.name||'未知申请人')+'</p><p>触发时间：'+esc(item.createdAt)+'</p></article><dl>'+hits+'</dl>'+(item.lastHandledBy?'<article class="card"><h3 style="margin-top:0">处理记录</h3><p>最近处理：'+esc(item.lastHandledBy)+' · '+esc(item.lastHandledAt)+'</p>'+(item.closeNote?'<p>关闭说明：'+esc(item.closeNote)+'</p><p>关闭人：'+esc(item.closedBy)+' · '+esc(item.closedAt)+'</p>':'')+'</article>':'')+'<div class="ops" id="actions"></div>';const actions=q('#actions');if(item.status==='pending'){const follow=document.createElement('button');follow.className='primary';follow.textContent='开始跟进';follow.onclick=()=>{const result=api.updateAlert(item.id,'in-progress',AdminPortalShell.currentAdmin().name);if(result.error)window.alert(result.error);openDetail(id);render()};actions.append(follow)}if(item.status!=='closed'){const immediate=document.createElement('button');immediate.className='secondary';immediate.textContent='立即随访';immediate.onclick=()=>window.AdminImmediateFollowup.open(item,()=>{openDetail(id);render();parent.postMessage({type:'prototype:state-changed',pageId:'A14',scenarioId:'A14-S04'},'*')});actions.append(immediate);const close=document.createElement('button');close.className='secondary';close.textContent='关闭预警';close.onclick=()=>{q('#close-note').value='';q('#close-error').textContent='';q('#close-modal').classList.add('open')};actions.append(close)}q('#detail').classList.add('open')}
    q('#detail-close').onclick=()=>q('#detail').classList.remove('open');q('#close-cancel').onclick=()=>q('#close-modal').classList.remove('open');q('#close-form').onsubmit=e=>{e.preventDefault();const result=api.updateAlert(selectedId,'closed',AdminPortalShell.currentAdmin().name,q('#close-note').value);if(result.error){q('#close-error').textContent=result.error;return}q('#close-modal').classList.remove('open');q('#detail').classList.remove('open');render();parent.postMessage({type:'prototype:state-changed',pageId:'A14',scenarioId:'A14-S03'},'*')};q('#level').onchange=render;q('#status').onchange=render;q('#from').onchange=render;q('#to').onchange=render;render();parent.postMessage({type:'prototype:page-ready',pageId:'A14'},'*')
  })()
  </script>
</body></html>

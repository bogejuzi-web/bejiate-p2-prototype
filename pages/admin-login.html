<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title> · 管理后台登录</title><script src="../nurse-portal-source.js"></script><style>:root{font-family:"Haas","PingFang SC","Microsoft YaHei",sans-serif;color:#181d26}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc}.shell{width:min(100%,980px);min-height:560px;display:grid;grid-template-columns:1.08fr .92fr;background:#fff;border:1px solid #dddddd;border-radius:10px;overflow:hidden}.intro{padding:64px 56px;background:#181d26;color:#fff}.intro small{display:block;margin-bottom:86px;color:#c8cbd2}.intro h1{margin:0;font-size:42px;font-weight:400;letter-spacing:-1px}.intro p{max-width:330px;margin:20px 0;color:#e4e6ea;line-height:1.7}.form{align-self:center;padding:48px}.form h2{margin:0;font-size:28px;font-weight:400}.form>p{margin:12px 0 32px;color:#41454d;font-size:14px}.field{display:block;margin:18px 0}.field span{display:block;margin-bottom:8px;font-size:14px}.field input{width:100%;height:44px;padding:0 13px;border:1px solid #dddddd;border-radius:6px;font:inherit}.field input:focus{outline:2px solid #458fff;border-color:#458fff}.submit{width:100%;height:48px;margin-top:12px;border:0;border-radius:12px;background:#181d26;color:#fff;font:inherit;padding:16px 24px}.submit:active{background:#0d1218}.error{display:none;margin-top:14px;padding:10px 12px;border-radius:6px;color:#aa2d00;background:#f9e8e1;font-size:13px}.error.visible{display:block}.note{margin-top:22px;color:#41454d;font-size:12px;line-height:1.6}@media(max-width:720px){body{display:block}.shell{min-height:100vh;border:0;border-radius:0;grid-template-columns:1fr}.intro{padding:32px}.intro small{margin-bottom:44px}.intro h1{font-size:34px}.form{padding:40px 28px}.intro p{margin-bottom:0}}</style></head><body><main class="shell"><section class="intro"><small> · 管理后台</small><h1>平台运营管理台</h1><p>使用平台分配的管理员账户登录，管理申请人账号、知情同意与平台数据。</p></section><section class="form" data-change-id="A01-C01"><h2>管理后台登录</h2><p>请输入您的管理账户信息。</p><form id="login"><label class="field"><span>管理员账号</span><input id="account" autocomplete="username" placeholder="请输入管理员账号" required></label><label class="field"><span>密码</span><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required></label><button class="submit" type="submit">登录</button><p class="error" id="error">账号或密码错误，请重新输入。</p></form><p class="note">管理员账户由平台分配，不提供自助注册。演示账号：admin / 123456</p></section></main><script>(()=>{const f=document.querySelector('#login'),e=document.querySelector('#error');f.addEventListener('submit',x=>{x.preventDefault();const account=document.querySelector('#account').value.trim(),password=document.querySelector('#password').value;const admin=window.NURSE_PORTAL_SOURCE&&window.NURSE_PORTAL_SOURCE.findAdminByAccount(account,password);if(admin){window.NURSE_PORTAL_SOURCE.setCurrentAdminId(admin.id);e.classList.remove('visible');parent.postMessage({type:'prototype:state-changed',pageId:'A01',scenarioId:'A01-S01'},'*');parent.postMessage({type:'prototype:navigation-request',pageId:'A11'},'*')}else{e.classList.add('visible');parent.postMessage({type:'prototype:state-changed',pageId:'A01',scenarioId:'A01-S02'},'*')}});parent.postMessage({type:'prototype:page-ready',pageId:'A01'},'*')})()</script></body></html>

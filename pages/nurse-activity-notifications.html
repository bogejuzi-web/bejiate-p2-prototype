<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动申请通知</title><link rel="stylesheet" href="../activity-application.css"><body><div class="layout"><aside id="sidebar"></aside><main class="main"><header class="top"><div><h2>活动申请通知</h2><p>查看后台对本人活动申请作出的处理结果。</p></div><button class="secondary" id="back">返回活动申请</button></header><section id="notice-list" class="list"></section></main></div><script src="../nurse-portal-source.js"></script><script src="../nurse-portal-shell.js"></script><script src="../activity-application-shared.js"></script><script>
;(function(){const api=window.ActivityApplication;const q=s=>document.querySelector(s);NursePortalShell.mountSidebar('#sidebar','N10');function esc(v){return String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const rows=api.get('activityNotifications');const box=q('#notice-list');box.replaceChildren();if(!rows.length){box.innerHTML='<div class="empty">暂无活动申请审批通知。</div>';return}rows.forEach(note=>{const st=api.status(note.result,'nurse');const row=document.createElement('article');row.className='row notice-row'+(!note.read?' unread':'');row.innerHTML='<div><h3>'+esc(note.title)+' <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>'+esc(note.content)+'</p><p>'+esc(note.createdAt)+(!note.read?' · 未读':'')+'</p></div>';const ops=document.createElement('div');ops.className='ops';const detail=document.createElement('button');detail.className='text-btn';detail.textContent='查看申请';detail.onclick=()=>{const rows=api.get('activityNotifications');const target=rows.find(x=>x.id===note.id);if(target){target.read=true;api.set('activityNotifications',rows)}api.setSelected(note.applicationId);api.navigate('N10')};ops.append(detail);row.append(ops);box.append(row)})}q('#back').onclick=()=>api.navigate('N10');render();parent.postMessage({type:'prototype:page-ready',pageId:'N11'},'*')})()
</script></body></html>

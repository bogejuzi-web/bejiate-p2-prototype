<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> · 万能表单</title><script src="../nurse-portal-source.js"></script><script src="../nurse-portal-mobile-shell.js"></script><style>
:root{font-family:"Haas","PingFang SC","Microsoft YaHei",sans-serif;
color:#181d26}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}.field{display:block;
margin:0 0 14px}.field>span{display:block;
margin-bottom:6px;
color:#41454d;
font-size:13px}.field input,.field select,.field textarea{width:100%;
min-height:42px;
padding:9px 10px;
border:1px solid #dddddd;
border-radius:7px;
background:#fff}.field textarea{height:72px}.section-title{margin:22px 0 8px;
font-size:15px;
font-weight:500}.builder-field{margin-bottom:10px;
padding:12px;
border:1px solid #dddddd;
border-radius:10px;
background:#fff}.builder-field.selected{border-color:#181d26}.builder-head{display:flex;
justify-content:space-between;
align-items:center}.builder-head strong{font-size:14px;
font-weight:500}.builder-head button{border:0;
background:transparent;
color:#aa2d00;
font-size:13px}.field-options{margin-top:10px}.field-options label{display:flex;
align-items:center;
gap:7px;
margin-top:9px;
font-size:13px}.field-options input[type="text"]{flex:1;
height:36px;
padding:0 9px;
border:1px solid #dddddd;
border-radius:6px}.option-row{display:flex;
gap:6px;
margin-top:7px}.option-row button{width:36px;
border:0;
background:transparent;
color:#aa2d00}.add-option{margin-top:8px;
border:0;
background:transparent;
color:#1b61c9;
font-size:13px}.add-field{width:100%;
height:42px;
border:1px dashed #9297a0;
border-radius:8px;
background:#fff;
color:#1b61c9}.error{min-height:20px;
margin:10px 0;
color:#aa2d00;
font-size:13px}.save{width:100%;
height:46px;
margin-top:8px;
border:0;
border-radius:9px;
background:#181d26;
color:#fff}.hint{margin:0;
color:#41454d;
font-size:13px;
line-height:1.5}
</style></head><body><script>(()=>{const source=window.NURSE_PORTAL_SOURCE,nurseId=source.getCurrentNurseId(),editingId=source.getEditingTemplateId();
let fields=[],selectedId='';
const existing=source.get('templates').find(t=>t.id===editingId);
const content=NursePortalMobileShell.mountShell({title:existing?'编辑随访模板':'创建随访模板',showBack:true,onBack:()=>NursePortalMobileShell.navigate('NM08')});
const name=document.createElement('input'),visibility=document.createElement('select'),fieldList=document.createElement('section'),add=document.createElement('select'),error=document.createElement('p'),save=document.createElement('button');
function wrap(label,node){const l=document.createElement('label');
l.className='field';
const s=document.createElement('span');
s.textContent=label;
l.append(s,node);
return l}name.placeholder='请输入模板名称';
name.maxLength=30;
name.value=existing?existing.name:'';
visibility.innerHTML='<option value="private">仅我可见</option><option value="public">全部申请人可见</option>';
visibility.value=existing?existing.visibility:'private';
content.append(wrap('模板名称',name),wrap('可见范围',visibility));
const title=document.createElement('h2');
title.className='section-title';
title.textContent='字段设置';
content.append(title,fieldList);
add.innerHTML='<option value="">+ 添加字段</option><option value="text">单行文本</option><option value="textarea">多行文本</option><option value="single-choice">单选</option><option value="multi-choice">多选</option><option value="number">数字</option><option value="percentage">百分数</option><option value="date">日期</option><option value="attachment">附件</option>';
add.className='add-field';
content.append(add);
error.className='error';
save.className='save';
save.type='button';
save.textContent='保存模板';
content.append(error,save);
fields=existing?JSON.parse(JSON.stringify(existing.fields)):[];
function labelFor(type){return {text:'单行文本',textarea:'多行文本','single-choice':'单选','multi-choice':'多选',number:'数字',percentage:'百分数',date:'日期',attachment:'附件'}[type]}function render(){fieldList.replaceChildren();
fields.forEach((f,index)=>{const card=document.createElement('article');
card.className='builder-field'+(f.id===selectedId?' selected':'');
const head=document.createElement('div');
head.className='builder-head';
const title=document.createElement('strong');
title.textContent=(index+1)+'. '+labelFor(f.type);
const remove=document.createElement('button');
remove.type='button';
remove.textContent='删除';
remove.onclick=()=>{fields=fields.filter(x=>x.id!==f.id);
render()};
head.append(title,remove);
card.append(head);
const settings=document.createElement('div');
settings.className='field-options';
settings.onclick=e=>e.stopPropagation();
const label=document.createElement('label');
label.textContent='标识名';
const text=document.createElement('input');
text.type='text';
text.value=f.label;
text.oninput=()=>{f.label=text.value;
title.textContent=(index+1)+'. '+(text.value||labelFor(f.type))};
label.append(text);
const required=document.createElement('label');
const check=document.createElement('input');
check.type='checkbox';
check.checked=!!f.required;
check.onchange=()=>f.required=check.checked;
required.append(check,document.createTextNode('设为必填'));
settings.append(label,required);
if(['single-choice','multi-choice'].includes(f.type)){f.options=f.options||['选项1','选项2'];
const optTitle=document.createElement('label');
optTitle.textContent='选项内容';
settings.append(optTitle);
f.options.forEach((option,i)=>{const row=document.createElement('div');
row.className='option-row';
const inp=document.createElement('input');
inp.type='text';
inp.value=option;
inp.oninput=()=>f.options[i]=inp.value;
const del=document.createElement('button');
del.type='button';
del.textContent='删除';
del.disabled=f.options.length<=2;
del.onclick=()=>{f.options.splice(i,1);
render()};
row.append(inp,del);
settings.append(row)});
const addOpt=document.createElement('button');
addOpt.type='button';
addOpt.className='add-option';
addOpt.textContent='+ 添加选项';
addOpt.onclick=()=>{f.options.push('新选项');
render()};
settings.append(addOpt)}if(f.type==='number'||f.type==='percentage'){const decimals=document.createElement('label');
decimals.textContent='支持小数位数';
const select=document.createElement('select');
select.innerHTML='<option value="0">不支持小数</option><option value="1">1 位</option><option value="2">2 位</option><option value="4">4 位</option>';
select.value=String(f.decimals||0);
select.onchange=()=>f.decimals=Number(select.value);
decimals.append(select);
settings.append(decimals)}
card.append(settings);
fieldList.append(card)})}add.onchange=()=>{if(!add.value)return;
const type=add.value;
fields.push({id:'field-'+Date.now(),label:labelFor(type),type,required:false,...(['single-choice','multi-choice'].includes(type)?{options:['选项1','选项2']}:{}),...(type==='number'||type==='percentage'?{decimals:0}:{})});
selectedId=fields[fields.length-1].id;
add.value='';
render()};
save.onclick=()=>{const title=name.value.trim();
if(!title||!fields.length||fields.some(f=>!f.label.trim())||fields.some(f=>['single-choice','multi-choice'].includes(f.type)&&f.options.some(o=>!o.trim()))){error.textContent='请填写模板名称，并至少保留一个完整字段。';
return}const templates=source.get('templates'),now='2026-09-10 10:00';
if(existing){const target=templates.find(t=>t.id===existing.id);
Object.assign(target,{name:title,visibility:visibility.value,fields:JSON.parse(JSON.stringify(fields)),updatedAt:now})}else templates.unshift({id:'template-'+Date.now(),name:title,creatorId:nurseId,creatorName:source.get('nurses').find(n=>n.id===nurseId).name,visibility:visibility.value,status:'active',usedByPlanCount:0,updatedAt:now,fields:JSON.parse(JSON.stringify(fields))});
source.set('templates',templates);
source.setEditingTemplateId('');
parent.postMessage({type:'prototype:navigation-request',pageId:'NM08'},'*')};
render();
parent.postMessage({type:'prototype:page-ready',pageId:'NM09'},'*')})()</script></body></html>

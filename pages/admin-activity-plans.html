<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>活动计划</title><link rel="stylesheet" href="../activity-application.css">
<style>.editor{display:none;position:fixed;z-index:100;top:50%;left:50%;width:min(760px,calc(100vw - 48px));max-height:calc(100vh - 48px);overflow:auto;padding:24px;border:1px solid #dde2e7;border-radius:12px;background:#fff;box-shadow:0 0 0 100vmax rgba(15,23,42,.42),0 18px 48px rgba(15,23,42,.22);transform:translate(-50%,-50%)}.editor.open{display:block}.field{display:block;margin:12px 0}.field input,.field select{width:100%;height:40px;padding:0 10px;border:1px solid #d6dbe1;border-radius:6px;font:inherit}.alloc{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f2}.summary{padding:12px;border-radius:8px;background:#f6f8fa;color:#41454d}.hidden{display:none}.rep-stats{width:100%;border-collapse:collapse;margin-top:16px}.rep-stats th,.rep-stats td{padding:8px;text-align:left;border-bottom:1px solid #edf0f2;font-size:13px}</style>
<body><div class="layout"><aside id="sidebar"></aside><main class="main">
<header class="top"><div><h2>活动计划</h2><p>选择表单，分配代表场次，发布后供代表申请。</p></div><button class="primary" id="new">新建活动计划</button></header>
<section id="editor" class="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title"><div class="top"><h2 id="editor-title">新建活动计划</h2><button class="secondary" id="cancel">取消</button></div>
<label class="field"><span>计划名称</span><input id="name" placeholder="请输入活动计划名称"></label>
<label class="field"><span>申请表单</span><select id="form"></select></label><button class="text-btn" id="new-form">新建万能表单</button>
<label class="field"><span>额度模式</span><select id="mode"><option value="limited">限额分配</option><option value="unlimited">不限额度</option></select></label>
<div id="limited"><label class="field"><span>总场次</span><input id="total" type="number" min="1" value="100"></label><h3>代表场次分配</h3><div id="allocations"></div><p id="summary" class="summary"></p></div>
<div id="rep-stats"></div>
<label class="field"><span>计划状态</span><select id="status"><option value="draft">草稿</option><option value="published">已发布</option><option value="ended">已结束</option></select></label><p id="error" class="error"></p>
<footer class="form-actions"><button class="secondary" id="save-draft">保存草稿</button><button class="primary" id="save">保存计划</button></footer></section><section id="list" class="list"></section>
</main></div>
<script src="../nurse-portal-source.js"></script><script src="../admin-portal-shell.js"></script><script src="../activity-application-shared.js"></script>
<script>
(()=>{
 const q=s=>document.querySelector(s),api=window.ActivityApplication; let editing=null;
 const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 AdminPortalShell.mountSidebar('#sidebar','A13');
 function formOptions(selected){q('#form').innerHTML=api.forms().map(f=>'<option value="'+f.id+'" '+(f.id===selected?'selected':'')+'>'+esc(f.name)+' · V'+(f.version||1)+'</option>').join('')||'<option value="">暂无表单</option>'}
 function activeReps(){return api.get('nurses').filter(x=>x.status==='active')}
 function updateSummary(){const total=Number(q('#total').value||0),used=[...q('#allocations').querySelectorAll('input')].reduce((n,x)=>n+Number(x.value||0),0);q('#summary').textContent='已分配 '+used+' 场，剩余可分配 '+(total-used)+' 场。';q('#summary').style.color=used>total?'#b42318':''}
 function renderAlloc(values={}){const box=q('#allocations');box.replaceChildren();activeReps().forEach(rep=>{const row=document.createElement('label');row.className='alloc';row.innerHTML='<span>'+esc(rep.name)+' · '+esc(rep.account)+'</span><input type="number" min="0" value="'+Number(values[rep.id]||0)+'" data-rep="'+rep.id+'">';box.append(row)});box.querySelectorAll('input').forEach(x=>x.oninput=updateSummary);updateSummary()}
 function renderStats(plan){const box=q('#rep-stats');if(!plan||plan.quotaMode!=='limited'){box.innerHTML='';return}const rows=activeReps().filter(r=>(plan.allocations||[]).some(a=>a.nurseId===r.id));box.innerHTML=rows.length?'<h3>代表申请情况</h3><table class="rep-stats"><thead><tr><th>代表</th><th>分配</th><th>已申请</th><th>审核中</th><th>已通过</th><th>剩余</th></tr></thead><tbody>'+rows.map(r=>{const s=api.planStats(plan,r.id);return '<tr><td>'+esc(r.name)+'</td><td>'+s.allocated+'</td><td>'+s.submitted+'</td><td>'+s.reviewing+'</td><td>'+s.approved+'</td><td>'+s.remaining+'</td></tr>'}).join('')+'</tbody></table>':'<div class="empty">尚未向有效代表分配场次。</div>'}
 function toggle(){q('#limited').classList.toggle('hidden',q('#mode').value==='unlimited')}
 function open(plan){editing=plan||null;q('#editor').classList.add('open');q('#editor-title').textContent=plan?'编辑活动计划':'新建活动计划';q('#name').value=plan?plan.name:'';const returned=api.editingForm(),preferred=returned&&api.formById(returned)?returned:(plan&&plan.formId)||(api.forms()[0]&&api.forms()[0].id)||'';formOptions(preferred);q('#mode').value=plan?plan.quotaMode:'limited';q('#total').value=plan?plan.totalQuota||100:100;q('#status').value=plan?plan.status:'draft';const values={};(plan&&plan.allocations||[]).forEach(a=>values[a.nurseId]=a.quota);renderAlloc(values);renderStats(plan);toggle()}
 function save(forceDraft){const name=q('#name').value.trim(),form=api.formById(q('#form').value),mode=q('#mode').value,total=Number(q('#total').value||0),allocations=[...q('#allocations').querySelectorAll('input')].filter(x=>Number(x.value||0)>0).map(x=>({nurseId:x.dataset.rep,quota:Number(x.value)})),allocated=allocations.reduce((n,x)=>n+x.quota,0),status=forceDraft?'draft':q('#status').value;if(!name||!form)return q('#error').textContent='请填写计划名称并选择申请表单。';if(mode==='limited'&&(!total||allocated>total))return q('#error').textContent='请设置有效总场次，且代表分配不能超过总场次。';if(status==='published'&&mode==='limited'&&!allocations.length)return q('#error').textContent='限额计划发布前至少分配一位代表。';api.savePlan({id:editing?editing.id:'activity-plan-'+Date.now(),name,status,quotaMode:mode,totalQuota:mode==='limited'?total:0,formId:form.id,formName:form.name,formVersion:form.version||1,formSnapshot:api.formSnapshot(form),allocations:mode==='limited'?allocations:[],createdAt:editing?editing.createdAt:api.now(),updatedAt:api.now()});api.setEditingForm('');q('#editor').classList.remove('open');render()}
 function render(){const box=q('#list');box.replaceChildren();api.plans().forEach(p=>{const s=api.planStats(p),row=document.createElement('article');row.className='row';row.innerHTML='<div><h3>'+esc(p.name)+' <i class="tag '+(p.status==='published'?'success':p.status==='ended'?'muted':'warning')+'">'+(p.status==='published'?'已发布':p.status==='ended'?'已结束':'草稿')+'</i></h3><p>'+esc(p.formName)+' · '+(p.quotaMode==='limited'?'总 '+s.totalQuota+' 场，已分配 '+s.allocated+' 场，未分配 '+s.unallocated+' 场':'不限额度，全部有效代表可申请')+'</p><p>已申报 '+s.submitted+' · 审核中 '+s.reviewing+' · 已通过 '+s.approved+'</p></div>';const b=document.createElement('button');b.className='text-btn';b.textContent='查看/编辑';b.onclick=()=>open(p);row.append(b);box.append(row)});if(!box.children.length)box.innerHTML='<div class="empty">暂无活动计划。</div>'}
 q('#new').onclick=()=>open(null);q('#cancel').onclick=()=>q('#editor').classList.remove('open');q('#mode').onchange=toggle;q('#total').oninput=updateSummary;q('#new-form').onclick=()=>{localStorage.setItem('bjt-activity-plan-form-return','1');api.setEditingForm('');api.navigate('A14')};q('#save').onclick=()=>save(false);q('#save-draft').onclick=()=>save(true);render();if(api.editingForm())open(null);parent.postMessage({type:'prototype:page-ready',pageId:'A13'},'*');
})();
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> · 知情同意</title>
  <style>
    :root{font-family:"Haas","PingFang SC","Microsoft YaHei",sans-serif;color:#181d26}*{box-sizing:border-box}body{margin:0;background:#f3f3f3}button{font:inherit;cursor:pointer}.page{min-height:100vh}.bar{height:62px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 12px;border-bottom:1px solid #ddd;background:#fff}.bar button{border:0;background:transparent;color:#181d26;font-size:28px;line-height:1}.bar h1{margin:0;text-align:center;font-size:20px;font-weight:500}.intro{padding:18px 20px 12px;color:#41454d;background:#fff;font-size:13px;line-height:1.6}.list{margin-top:10px;background:#fff}.record{display:flex;width:100%;align-items:center;gap:12px;padding:18px 20px;border:0;border-bottom:1px solid #eee;background:#fff;color:#181d26;text-align:left}.record:last-child{border-bottom:0}.record strong{display:block;font-size:16px;font-weight:500}.record span{display:block;margin-top:6px;color:#66717d;font-size:13px}.record .tag{margin:0 0 0 auto;padding:4px 7px;border-radius:999px;color:#006400;background:#e7f4f1;font-size:11px;white-space:nowrap}.record .tag.history{color:#41454d;background:#f1f2f3}.arrow{margin-left:2px;color:#b6bac0;font-size:24px}.note{padding:16px 20px;color:#66717d;font-size:12px;line-height:1.55}.highlight{outline:3px solid #f4d35e;outline-offset:-3px}
  </style>
</head>
<body>
  <main class="page">
    <header class="bar"><button id="back" type="button" aria-label="返回">‹</button><h1>知情同意</h1><span></span></header>
    <p class="intro">您可查看本人已签署的知情同意记录。协议更新后，新的签署记录会保留在此列表中。</p>
    <section class="list" data-change-id="P10-C01" aria-label="已签署知情同意列表">
      <button class="record" type="button" data-target="P08"><span><strong>患者服务知情同意书</strong><span>签署时间：2026 年 9 月 9 日 09:06</span></span><span class="tag">当前有效</span><span class="arrow">›</span></button>
      <button class="record" type="button" data-target="P08"><span><strong>患者服务知情同意书</strong><span>签署时间：2026 年 3 月 1 日 10:20</span></span><span class="tag history">历史记录</span><span class="arrow">›</span></button>
    </section>
    <p class="note">协议内容更新后，需重新签署；已签署的旧记录会保留，便于查阅。</p>
  </main>
  <script>
    (()=>{document.querySelector('#back').addEventListener('click',()=>parent.postMessage({type:'prototype:navigation-request',pageId:'P06'},'*'));document.querySelectorAll('[data-target]').forEach(button=>button.addEventListener('click',()=>parent.postMessage({type:'prototype:navigation-request',pageId:button.dataset.target},'*')));window.addEventListener('message',(event)=>{const changeId=(event.data||{}).changeId;if((event.data||{}).type!=='prototype:highlight'||changeId!=='P10-C01')return;const target=document.querySelector('[data-change-id="P10-C01"]');target.classList.add('highlight');target.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>target.classList.remove('highlight'),1800);parent.postMessage({type:'prototype:highlight-result',changeId,success:true},'*')});parent.postMessage({type:'prototype:page-ready',pageId:'P10'},'*')})()
  </script>
</body>
</html>

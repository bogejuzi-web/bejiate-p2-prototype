<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title> · 我的</title><style>:root{font-family:"Haas","PingFang SC","Microsoft YaHei",sans-serif;color:#181d26}*{box-sizing:border-box}body{margin:0;background:#f3f3f3}button{font:inherit;cursor:pointer}.page{min-height:100vh;padding:30px 0 100px}.page h1{margin:0 20px 24px;font-size:28px;font-weight:400}.profile{display:flex;align-items:center;gap:14px;padding:20px;background:#fff}.avatar{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#181d26;color:#fff;font-size:18px}.profile strong{font-size:16px;font-weight:500}.profile span{display:block;margin-top:5px;color:#41454d;font-size:13px}.group{margin-top:10px;background:#fff}.link{display:flex;width:100%;align-items:center;justify-content:space-between;padding:18px 20px;border:0;border-bottom:1px solid #eee;background:#fff;color:#181d26;text-align:left;font-size:16px}.link:last-child{border-bottom:0}.arrow{color:#b6bac0;font-size:24px}.logout{width:100%;margin-top:10px;padding:18px 20px;border:0;background:#fff;color:#aa2d00;text-align:left;font-size:16px}.tabbar{position:fixed;right:0;bottom:0;left:0;display:grid;grid-template-columns:repeat(3,1fr);min-height:68px;padding:7px 18px calc(7px + env(safe-area-inset-bottom));border-top:1px solid #ddd;background:#fff}.tab{border:0;color:#41454d;background:transparent;font-size:12px}.tab[aria-current="page"]{color:#181d26;font-weight:500}.overlay{position:fixed;inset:0;display:none;align-items:flex-end;background:rgba(24,29,38,.32)}.overlay.visible{display:flex}.dialog{width:100%;padding:24px 20px calc(24px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;background:#fff}.dialog h2{margin:0;font-size:20px;font-weight:500}.dialog p{margin:10px 0 20px;color:#41454d;font-size:14px}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dialog button{height:46px;border:0;border-radius:10px;background:#f3f3f3}.dialog .confirm{background:#181d26;color:#fff}.highlight{outline:3px solid #f4d35e;outline-offset:-3px}</style></head><body><main class="page"><h1>我的</h1><section class="profile"><span class="avatar">王</span><div><strong>王女士</strong><span>151 0165 8625</span></div></section><section class="group"><button class="link" type="button" data-target="P09" data-change-id="P06-C01"><span>平台服务协议</span><span class="arrow">›</span></button><button class="link" type="button" data-target="P08" data-change-id="P06-C02"><span>已签署知情同意</span><span class="arrow">›</span></button></section><button class="logout" id="logout" type="button" data-change-id="P06-C03">退出登录</button></main><nav class="tabbar" aria-label="患者端导航"><button class="tab" type="button" data-target="P04">服务</button><button class="tab" type="button" data-target="P05">健康档案</button><button class="tab" type="button" aria-current="page">我的</button></nav><div class="overlay" id="overlay"><section class="dialog"><h2>确认退出登录？</h2><p>退出后需要再次使用手机号和验证码登录。</p><div class="dialog-actions"><button id="cancel" type="button">取消</button><button class="confirm" id="confirm" type="button">确认退出</button></div></section></div><script>(()=>{const overlay=document.querySelector('#overlay');document.querySelectorAll('[data-target]').forEach(button=>button.addEventListener('click',()=>parent.postMessage({type:'prototype:navigation-request',pageId:button.dataset.target},'*')));document.querySelector('#logout').addEventListener('click',()=>{overlay.classList.add('visible');parent.postMessage({type:'prototype:state-changed',pageId:'P06',scenarioId:'P06-S02'},'*')});document.querySelector('#cancel').addEventListener('click',()=>overlay.classList.remove('visible'));document.querySelector('#confirm').addEventListener('click',()=>parent.postMessage({type:'prototype:navigation-request',pageId:'P01'},'*'));parent.postMessage({type:'prototype:page-ready',pageId:'P06'},'*')})()</script></body></html>

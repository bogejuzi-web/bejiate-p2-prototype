<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预警提示（手机端）</title><body><script src="../nurse-portal-source.js"></script><script src="../nurse-portal-mobile-shell.js"></script><script src="../followup-alert-shared.js"></script><script>
;(function(){const api=window.FollowupAlert,nurseId=window.NURSE_PORTAL_SOURCE.getCurrentNurseId(),style=document.createElement('style');style.textContent='.filter{width:100%;margin-bottom:12px;padding:10px;border:1px solid #ccd6dc;border-radius:8px;background:#fff;font:inherit}.card{width:100%;padding:14px;margin-bottom:10px;border:1px solid #e2e8ec;border-radius:10px;background:#fff;text-align:left;font:inherit}.card h3{margin:0 0 7px;font-size:16px}.card p{margin:5px 0;color:#65717a;font-size:13px}.tag{display:inline-block;padding:2px 7px;border-radius:99px;font-size:12px;font-style:normal}.danger{background:#ffebe9;color:#b42318}.warning{background:#fff4db;color:#9c6500}.info{background:#e7f0ff;color:#1754aa}.success{background:#e5f6eb;color:#19733a}.full{position:fixed;z-index:20;inset:0;overflow:auto;background:#f8fafc}.full[hidden]{display:none}.head{position:sticky;top:0;display:flex;justify-content:space-between;padding:12px;background:#fff;border-bottom:1px solid #e2e8ec}.head h2{margin:0;font-size:17px}.body{padding:14px}.body dt{margin-top:14px;color:#65717a;font-size:13px}.body dd{margin:4px 0;line-height:1.5}.text{border:0;background:transparent;color:#155f8d;font:inherit}.empty{padding:28px;text-align:center;color:#65717a;background:#fff;border-radius:10px}';document.head.append(style);const detail=document.createElement('section');detail.className='full';detail.hidden=true;const content=NursePortalMobileShell.mountShell({title:'预警提示',activeTab:'NM06'});document.body.append(detail);content.innerHTML='<select class="filter" id="filter"><option value="open">未关闭</option><option value="">全部状态</option><option value="pending">待处理</option><option value="in-progress">跟进中</option><option value="closed">已关闭</option></select><div id="list"></div>';const q=s=>document.querySelector(s),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),patient=id=>api.get('patients').find(x=>x.id===id);function render(){const filter=q('#filter').value,rows=api.nurseAlerts(nurseId).filter(x=>filter==='open'?x.status!=='closed':!filter||x.status===filter),box=q('#list');box.replaceChildren();if(!rows.length){box.innerHTML='<div class="empty">暂无符合条件的预警。</div>';return}rows.forEach(item=>{const lv=api.levelMeta(item.level),st=api.statusMeta(item.status),hit=item.hits[0]||{},card=document.createElement('button');card.className='card';card.innerHTML='<h3>'+esc(patient(item.patientId)?.name||'未知患者')+' <i class="tag '+lv.tone+'">'+lv.label+'级</i> <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>'+esc(hit.fieldLabel)+'：'+esc(hit.value)+'</p><p>'+esc(item.createdAt)+'</p>';card.onclick=()=>open(item);box.append(card)})}function open(item){const lv=api.levelMeta(item.level),st=api.statusMeta(item.status),hits=item.hits.map(hit=>'<dt>'+esc(hit.ruleName)+' · '+esc(hit.fieldLabel)+'</dt><dd>触发值：'+esc(hit.value)+'；条件：'+esc(api.describeCondition(hit))+'</dd>').join('');detail.hidden=false;detail.innerHTML='<header class="head"><button class="text" id="back">返回</button><h2>预警详情</h2><span></span></header><main class="body"><article class="card"><h3>'+esc(patient(item.patientId)?.name||'未知患者')+' <i class="tag '+lv.tone+'">'+lv.label+'级</i> <i class="tag '+st.tone+'">'+st.label+'</i></h3><p>触发时间：'+esc(item.createdAt)+'</p></article><dl>'+hits+'</dl>'+(item.lastHandledBy?'<article class="card"><h3>后台处理</h3><p>最近处理：'+esc(item.lastHandledBy)+' · '+esc(item.lastHandledAt)+'</p>'+(item.closeNote?'<p>关闭说明：'+esc(item.closeNote)+'</p><p>关闭时间：'+esc(item.closedAt)+'</p>':'')+'</article>':'')+'</main>';q('#back').onclick=()=>detail.hidden=true}q('#filter').onchange=render;render();parent.postMessage({type:'prototype:page-ready',pageId:'NM14'},'*')})()
</script></body></html>

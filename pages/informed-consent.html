  <style>
    :root { color: #181d26; background: #fff; font-family: "Haas", "PingFang SC", "Microsoft YaHei", sans-serif; } * { box-sizing: border-box; } body { margin: 0; background: #fff; } button, input { font: inherit; } button { cursor: pointer; }.page { min-height: 100vh; display: flex; flex-direction: column; padding: 28px 24px 24px; }.brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; letter-spacing: .04em; }.brand-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: #fff; background: #181d26; font-size: 15px; }.heading { margin: 42px 0 20px; }.heading h1 { margin: 0; font-size: 28px; font-weight: 400; letter-spacing: -.03em; }.heading p { margin: 10px 0 0; color: #41454d; font-size: 13px; line-height: 1.6; }.document { flex: 1; min-height: 300px; padding: 16px; overflow: auto; border: 1px solid #dddddd; border-radius: 10px; background: #fff; color: #333840; font-size: 13px; line-height: 1.72; }.document h2 { margin: 0 0 10px; color: #181d26; font-size: 16px; font-weight: 500; }.document h3 { margin: 20px 0 6px; color: #181d26; font-size: 14px; font-weight: 500; }.document p { margin: 0; }.document p + p { margin-top: 9px; }.document-meta { margin-bottom: 16px; color: #41454d; font-size: 12px; }.confirm { display: flex; align-items: flex-start; gap: 10px; margin: 18px 0 14px; color: #333840; font-size: 13px; line-height: 1.55; }.confirm input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: #181d26; }.submit { height: 48px; border: 0; border-radius: 12px; color: #fff; background: #181d26; font-size: 16px; font-weight: 500; }.submit:disabled { color: #9297a0; background: #e0e2e6; cursor: not-allowed; }.note { margin: 14px 0 0; color: #41454d; font-size: 12px; line-height: 1.55; }.highlight { outline: 3px solid #f4d35e; outline-offset: 4px; border-radius: 8px; }

<body>
  <main class="page"><div class="brand"><span class="brand-mark">贝</span><span></span></div><header class="heading"><h1>知情同意</h1><p>请阅读以下内容，并确认是否同意。</p></header><article class="document" data-change-id="P03-C01"><h2>患者服务知情同意书</h2><p class="document-meta">模板版本：V1.0 · 生效日期：2026 年 9 月</p><p>本文件为原型评审使用的虚拟内容，用于说明患者在使用服务前需完成知情同意确认。</p><h3>一、服务说明</h3><p>平台用于支持申请人为患者提供健康服务管理，患者可在授权范围内查看与维护本人健康信息。</p><h3>二、信息处理</h3><p>平台将根据服务需要处理与您相关的信息，并保留必要的服务与操作记录。</p><h3>三、您的确认</h3><p>勾选并提交即表示您已阅读、理解并同意本知情同意书的内容。</p></article><label class="confirm" data-change-id="P03-C02"><input type="checkbox" id="confirm"><span>我已阅读并理解上述知情同意内容。</span></label><button class="submit" id="submit" type="button" disabled data-change-id="P03-C03">确认签署</button></main>
  <script>
    (() => { const confirm = document.querySelector('#confirm'), submit = document.querySelector('#submit'); confirm.addEventListener('change', () => { submit.disabled = !confirm.checked; }); submit.addEventListener('click', () => { parent.postMessage({ type: 'prototype:state-changed', pageId: 'P03', scenarioId: 'P03-S02' }, '*'); parent.postMessage({ type: 'prototype:navigation-request', pageId: 'P04' }, '*'); }); function highlight(changeId) { const target = document.querySelector(`[data-change-id="${changeId}"]`); if (!target) return; target.classList.add('highlight'); target.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => target.classList.remove('highlight'), 1800); parent.postMessage({ type: 'prototype:highlight-result', changeId, success: true }, '*'); } window.addEventListener('message', (event) => { if ((event.data || {}).type === 'prototype:highlight') highlight(event.data.changeId); if ((event.data || {}).type === 'prototype:reset') { confirm.checked = false; submit.disabled = true; } }); parent.postMessage({ type: 'prototype:page-ready', pageId: 'P03' }, '*'); })();
  </script>

<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>代表管理</title><link rel="stylesheet" href="../activity-application.css">
<style>.toolbar input{min-width:260px;padding:9px 12px;border:1px solid #d6dbe1;border-radius:6px}.drawer-panel{max-width:620px}.rep-form label{display:block;margin:14px 0}.rep-form input{box-sizing:border-box;width:100%;height:40px;margin-top:6px;padding:0 10px;border:1px solid #d6dbe1;border-radius:6px;font:inherit}.rep-actions{display:flex;gap:10px;margin-top:22px}.detail dl{display:grid;grid-template-columns:100px 1fr;gap:8px;margin:0 0 18px}.detail dt{color:#65717a}.detail dd{margin:0}.card{padding:12px;margin:10px 0;border:1px solid #e5e9ed;border-radius:8px}</style>
<body><div class="layout"><aside id="sidebar"></aside><main class="main"><header class="top"><div><h2>代表管理</h2><p>维护已注册代表的信息、状态和活动计划额度。</p></div></header><section class="toolbar"><input id="search" placeholder="搜索姓名、账号、大区、公司"></section><section id="list" class="list"></section></main></div>
<div class="drawer" id="drawer"><section class="drawer-panel"><div class="top"><h2 id="drawer-title">代表详情</h2><button class="secondary" id="close">关闭</button></div><section id="detail" class="detail"></section><form id="form" class="rep-form" hidden><label>姓名<input id="name" required maxlength="20"></label><label>账号<input id="account" required maxlength="30"></label><label>所在大区<input id="region" maxlength="30" placeholder="如：华东大区"></label><label>所在公司<input id="company" maxlength="50" placeholder="如：贝捷泰上海公司"></label><label>部门<input id="department" maxlength="30" placeholder="可选"></label><p class="error" id="error"></p><div class="rep-actions"><button class="primary" type="submit">保存</button><button class="secondary" id="cancel" type="button">取消</button></div></form></section></div>
<script src="../nurse-portal-source.js"></script><script src="../admin-portal-shell.js"></script><script src="../activity-application-shared.js"></script><script>
(()=>{const q=s=>document.querySelector(s),api=window.ActivityApplication;let editing=null;const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));AdminPortalShell.mountSidebar('#sidebar','A10');
function totals(rep){return api.plans().filter(p=>p.quotaMode==='limited').reduce((sum,p)=>{const s=api.planStats(p,rep.id);return {allocated:sum.allocated+s.allocated,occupied:sum.occupied+s.occupied,remaining:sum.remaining+s.remaining}},{allocated:0,occupied:0,remaining:0})}function open(){q('#drawer').classList.add('open')}function close(){q('#drawer').classList.remove('open');editing=null}
function render(){const key=q('#search').value.trim().toLowerCase(),box=q('#list');box.replaceChildren();api.get('nurses').filter(r=>!key||[r.name,r.account,r.region,r.company].some(v=>String(v||'').toLowerCase().includes(key))).forEach(rep=>{const all=totals(rep),row=document.createElement('article');row.className='row';row.innerHTML='<div><h3>'+esc(rep.name)+' <i class="tag '+(rep.status==='active'?'success':'muted')+'">'+(rep.status==='active'?'有效':'已停用')+'</i></h3><p>'+esc(rep.account)+' · '+esc(rep.region||'未设置大区')+' · '+esc(rep.company||'未设置公司')+'</p><p>已分配 '+all.allocated+' 场 · 已占用 '+all.occupied+' 场 · 剩余 '+all.remaining+' 场</p></div>';const ops=document.createElement('div');ops.className='ops';[['查看详情',()=>detail(rep)],['编辑',()=>edit(rep)],[rep.status==='active'?'停用':'启用',()=>toggle(rep)]].forEach(([label,fn])=>{const b=document.createElement('button');b.className='text-btn';b.textContent=label;b.onclick=fn;ops.append(b)});row.append(ops);box.append(row)});if(!box.children.length)box.innerHTML='<div class="empty">暂无匹配代表。</div>'}
function detail(rep){editing=rep;q('#drawer-title').textContent='代表详情';q('#form').hidden=true;const plans=api.plans().filter(p=>p.quotaMode==='limited'&&(p.allocations||[]).some(a=>a.nurseId===rep.id));q('#detail').innerHTML='<dl><dt>账号</dt><dd>'+esc(rep.account)+'</dd><dt>所在大区</dt><dd>'+esc(rep.region||'未设置')+'</dd><dt>所在公司</dt><dd>'+esc(rep.company||'未设置')+'</dd><dt>部门</dt><dd>'+esc(rep.department||'未设置')+'</dd><dt>状态</dt><dd>'+esc(rep.status==='active'?'有效':'已停用')+'</dd></dl>'+(plans.length?plans.map(p=>{const s=api.planStats(p,rep.id);return '<article class="card"><h3>'+esc(p.name)+'</h3><p>分配 '+s.allocated+' · 已申请 '+s.submitted+' · 审核中 '+s.reviewing+' · 已通过 '+s.approved+' · 剩余 '+s.remaining+'</p></article>'}).join(''):'<div class="empty">该代表暂无活动计划分配。</div>');open()}
function edit(rep){editing=rep;q('#drawer-title').textContent='编辑代表';q('#detail').innerHTML='';q('#form').hidden=false;['name','account','region','company','department'].forEach(k=>q('#'+k).value=rep[k]||'');q('#error').textContent='';open()}function toggle(rep){const next=rep.status==='active'?'disabled':'active';if(!confirm('确认'+(next==='disabled'?'停用':'启用')+'代表“'+rep.name+'”？'+(next==='disabled'?'停用后将不能再查看或提交活动计划。':'')))return;api.set('nurses',api.get('nurses').map(r=>r.id===rep.id?{...r,status:next}:r));render()}
q('#form').onsubmit=e=>{e.preventDefault();const rows=api.get('nurses'),next={...editing,name:q('#name').value.trim(),account:q('#account').value.trim(),region:q('#region').value.trim(),company:q('#company').value.trim(),department:q('#department').value.trim()};if(rows.some(r=>r.id!==next.id&&r.account===next.account)){q('#error').textContent='该账号已被其他代表使用。';return}api.set('nurses',rows.map(r=>r.id===next.id?next:r));close();render()};q('#close').onclick=close;q('#cancel').onclick=close;q('#search').oninput=render;render();parent.postMessage({type:'prototype:page-ready',pageId:'A10'},'*')})();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> · 项目说明</title><style>
:root{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#181d26;background:#f8fafc}*{box-sizing:border-box}body{margin:0}.doc{max-width:1080px;margin:0 auto;padding:48px}.doc-title{margin:0 0 26px;padding:30px 34px;border-radius:12px;background:#181d26;color:#fff;font-size:32px;font-weight:400}.doc-title small{display:block;margin-top:10px;color:#c8cbd2;font-size:13px;font-weight:400}.markdown{padding:4px 0 30px}.markdown h1,.markdown h2,.markdown h3{margin:30px 0 14px;color:#181d26;font-weight:500}.markdown h1{font-size:28px}.markdown h2{padding-top:24px;border-top:1px solid #ddd;font-size:21px}.markdown h3{font-size:17px}.markdown p,.markdown li{color:#41454d;font-size:14px;line-height:1.8}.markdown ul{margin:8px 0 16px;padding-left:22px}.markdown pre{margin:16px 0;padding:18px 20px;border-radius:8px;background:#181d26;color:#f8fafc;overflow:auto;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}.markdown table{width:100%;margin:16px 0;border-collapse:collapse;font-size:13px}.markdown th,.markdown td{padding:12px;border:1px solid #e6e8ea;text-align:left;vertical-align:top;line-height:1.55}.markdown th{background:#f8fafc;color:#41454d;font-weight:500}.loading,.error{padding:30px;border:1px dashed #cbd5dc;border-radius:10px;color:#41454d;text-align:center}.error{color:#aa2d00}@media(max-width:720px){.doc{padding:18px}.doc-title{padding:22px;font-size:26px}.markdown table{display:block;overflow-x:auto;white-space:nowrap}}
</style></head><body><main class="doc"><h1 class="doc-title">项目说明<small>内容直接读取：docs/需求确认.md</small></h1><article class="markdown" id="markdown"><p class="loading">正在读取需求确认文档…</p></article></main><script>
const root=document.querySelector('#markdown')
function appendInline(parent,text){const parts=text.split('**');parts.forEach((part,index)=>{const node=index%2?document.createElement('strong'):document.createTextNode(part);if(index%2)node.textContent=part;parent.append(node)})}
function cellText(value){return value.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(cell=>cell.trim())}
function isDivider(line){return /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line)}
function render(markdown){root.replaceChildren();const lines=markdown.replace(/\r/g,'').split('\n');for(let i=0;i<lines.length;){const line=lines[i];if(!line.trim()){i++;continue}if(line.startsWith('```')){const pre=document.createElement('pre'),code=document.createElement('code');i++;let value='';while(i<lines.length&&!lines[i].startsWith('```')){value+=lines[i]+'\n';i++}code.textContent=value.trimEnd();pre.append(code);root.append(pre);i++;continue}if(line.startsWith('|')&&i+1<lines.length&&isDivider(lines[i+1])){const table=document.createElement('table'),thead=document.createElement('thead'),headRow=document.createElement('tr');cellText(line).forEach(value=>{const cell=document.createElement('th');cell.textContent=value;headRow.append(cell)});thead.append(headRow);table.append(thead);i+=2;const tbody=document.createElement('tbody');while(i<lines.length&&lines[i].startsWith('|')){const row=document.createElement('tr');cellText(lines[i]).forEach(value=>{const cell=document.createElement('td');appendInline(cell,value);row.append(cell)});tbody.append(row);i++}table.append(tbody);root.append(table);continue}const heading=line.match(/^(#{1,3})\s+(.+)$/);if(heading){const element=document.createElement('h'+heading[1].length);appendInline(element,heading[2]);root.append(element);i++;continue}if(line.startsWith('- ')){const list=document.createElement('ul');while(i<lines.length&&lines[i].startsWith('- ')){const item=document.createElement('li');appendInline(item,lines[i].slice(2));list.append(item);i++}root.append(list);continue}const paragraph=document.createElement('p');appendInline(paragraph,line);root.append(paragraph);i++}}
fetch('/__project-requirements.md',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('无法读取需求确认文档');return response.text()}).then(render).catch(error=>{root.replaceChildren();const message=document.createElement('p');message.className='error';message.textContent=error.message;root.append(message)}).finally(()=>parent.postMessage({type:'prototype:page-ready',pageId:'I01'},'*'))
</script></body></html>
